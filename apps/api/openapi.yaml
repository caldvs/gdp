        - uploadId
        - url
        - expiresAt
        - maxBytes
    User:
      type: object
      properties:
        userId:
          type: string
          description: Google sub claim
        displayName:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type: string
          format: uri
        needsName:
          type: boolean
          description: A phone account with no name yet (#213); the web app asks for one before anything else.
        guestSessionId:
          type: string
          format: uuid
          description: Set for a guest who joined with just a name (#183); their token works for this session only.
        payoutAccount:
          type: object
          properties:
            sortCode:
              type: string
              pattern: ^\d{6}$
              description: UK sort code, 6 digits, no separators
              example: '040668'
            accountNumber:
              type: string
              pattern: ^\d{8}$
              description: UK account number, 8 digits
              example: '00079660'
            accountHolderName:
              type: string
              minLength: 1
              maxLength: 150
              example: Callum Davies
            monzoHandle:
              type: string
              pattern: ^[a-zA-Z0-9._-]{1,30}$
              description: Optional monzo.me username (without the leading `@` or domain). When set, guest payment instructions include a one-tap `https://monzo.me/<handle>/...` link.
              example: callum.davies
            revolutTag:
              type: string
              pattern: ^[a-zA-Z0-9]{1,32}$
              description: Optional Revolut tag (without the leading `@`). When set, guest payment instructions include a one-tap `https://revolut.me/<tag>/...` link.
              example: callumd
          required:
            - sortCode
            - accountNumber
            - accountHolderName
          description: |
            **Deprecated** per ADR-0002. Bank details are now device-local and
            exchanged peer-to-peer via QR. The field may still be returned for
            users created before the migration but new clients should ignore it
            and read the lead's payout from the QR fragment.
          deprecated: true
      required:
        - userId
        - displayName
    Venue:
      type: object
      properties:
        placeId:
          type: string
        name:
          type: string
        address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
  parameters: {}
paths:
  /healthz:
    get:
      operationId: healthcheck
      summary: Liveness probe
      tags:
        - ops
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
  /readyz:
    get:
      operationId: readiness
      summary: Readiness probe (checks DDB and S3 connectivity)
      tags:
        - ops
      security: []
      responses:
        '200':
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  checks:
                    type: object
                    properties:
                      ddb:
                        type: string
                        enum:
                          - ok
                          - fail
                      s3:
                        type: string
                        enum:
                          - ok
                          - fail
                required:
                  - status
                  - checks
        '503':
          description: One or more dependencies are unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/email/start:
    post:
      operationId: startEmailSignIn
      summary: Email a 6-digit sign-in code
      description: |
        Emails a 6-digit code. The subject leads with it ("123456 is your
        Pay Me Back code"), so it shows in the phone's notification and can
        be typed without opening the email. It works once, for 15 minutes,
        and only with the `requestId` returned here: the tab that asked
        keeps that secret and sends it with the code to
        `POST /v1/auth/email/verify`. Only hashes of both are stored.

        At most one code every 30 seconds and 5 every 15 minutes per
        address (counted without `+tags` or Gmail dots), 20 an hour per IP
        address, and 1000 an hour in all (429 otherwise).

        The response is the same whether or not the address has an
        account, so addresses can't be enumerated. Email delivery failures
        (e.g. SES bounce) also return `200` and are logged server-side.

        An address on `TABLE_FEE_EXEMPT_EMAILS` gets no code: the response
        carries `token` and `user` instead of `requestId`, and the caller is
        signed in.
      tags:
        - identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
              required:
                - email
      responses:
        '200':
          description: Code sent (or treated as sent).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  requestId:
                    type: string
                    description: Everyone but exempt addresses. Secret; keep it in the tab that asked.
                  token:
                    type: string
                    description: 'Exempt addresses only: the session JWT.'
                  user:
                    type: object
                    properties:
                      userId:
                        type: string
                      email:
                        type: string
                      displayName:
                        type: string
                    required:
                      - userId
                      - email
                      - displayName
                    description: Exempt addresses only.
                required:
                  - ok
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: |
            `RATE_LIMITED`: a code was sent to this address less than 30
            seconds ago, 5 have been sent in the last 15 minutes, 20 this
            hour from this IP address, or 1000 this hour in all.
            `details.retryAfterSeconds` says when to try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/email/test-sign-in:
    post:
      operationId: testAccountSignIn
      summary: Sign in to a test account without a code (local and dev only)
      description: |
        For trying the app as several people at once. Only `@test.invalid`
        addresses (reserved, so never a real person's), and only where the
        server enables it: local and dev, never prod (404 there). A known
        address gets its existing account; a new one gets a new account.
      tags:
        - identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
              required:
                - email
      responses:
        '200':
          description: Signed in. Same shape as `openEmailSignInLink`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      userId:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      displayName:
                        type: string
                    required:
                      - userId
                      - email
                      - displayName
                required:
                  - token
                  - user
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Test accounts are off on this server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/email/verify:
    post:
      operationId: verifyEmailSignInCode
      summary: Sign in with the emailed code
      description: |
        The tab that asked sends its `requestId` and the code the person
        typed. `signedIn` with a session JWT (good for 30 days) for the
        right code; the account for that email is found or made. `wrong`
        with `attemptsLeft` otherwise: a request allows 5 tries, right or
        wrong. `expired` once the code is used up, past 15 minutes, or the
        `requestId` isn't one we gave out: ask for a new code.

        The right code can be entered again by the same tab for 5 minutes
        after it's first used (a phone's autofill and a tap can send it
        twice), and keeps answering `signedIn`. POST so the secret stays
        out of logs.
      tags:
        - identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestId:
                  type: string
                  minLength: 1
                  maxLength: 200
                code:
                  type: string
                  pattern: ^[0-9]{6}$
              required:
                - requestId
                - code
      responses:
        '200':
          description: What the code came to.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - signedIn
                      - wrong
                      - expired
                  token:
                    type: string
                    description: '`signedIn` only: the session JWT.'
                  user:
                    type: object
                    properties:
                      userId:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      displayName:
                        type: string
                    required:
                      - userId
                      - email
                      - displayName
                    description: '`signedIn` only.'
                  attemptsLeft:
                    type: integer
                    minimum: 1
                    description: '`wrong` only: tries left on this code.'
                required:
                  - status
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/auth/methods:
    get:
      operationId: getSignInMethods
      summary: Which ways to sign in are on here
      description: |
        #213. `sms` (and `phone`, the same) is true once texts are set up on
        this server (#231: `SMS_SENDER_ID`). Email stays on until phone
        sign-in is live.
      tags:
        - identity
      security: []
      responses:
        '200':
          description: The switched-on methods.
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: boolean
                  phone:
                    type: boolean
                    description: Phone sign-in is on.
                  sms:
                    type: boolean
                required:
                  - email
                  - phone
                  - sms
  /v1/auth/phone/start:
    post:
      operationId: startPhoneSignIn
      summary: Send a 4-digit sign-in code to a phone
      description: |
        #213, #231. Texts a 4-digit code through AWS End User Messaging SMS,
        in our own words. It works for 10 minutes, 5 tries, and only
        with the `requestId` returned here, sent with the code to
        `POST /v1/auth/phone/verify`. UK mobiles only for now; the number is
        kept as E.164 and never logged whole.

        Codes cost money, so the limits are tight: one every 30 seconds and
        3 an hour per number, 10 an hour per IP address, 200 an hour in all
        (429 otherwise). Without texts set up here it answers 503.
      tags:
        - identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  minLength: 6
                  maxLength: 24
                  description: As typed, e.g. "07700 900123".
                channel:
                  type: string
                  enum:
                    - sms
                  description: Optional; texts are the only channel.
              required:
                - phone
      responses:
        '200':
          description: Code sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  requestId:
                    type: string
                    description: Secret; keep it in the tab that asked.
                  phone:
                    type: string
                    description: The number as E.164, to show back to the person.
                required:
                  - ok
                  - requestId
                  - phone
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: '`RATE_LIMITED`: see the limits above. `details.retryAfterSeconds` says when to try again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: "`CHANNEL_UNAVAILABLE`: texts aren't on here."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/phone/verify:
    post:
      operationId: verifyPhoneSignInCode
      summary: Sign in with the phone code
      description: |
        #213. Like `POST /v1/auth/email/verify`, with a 4-digit code. The
        account for the number is found or made; `isNew` is true when it
        has no name yet, and the web app then asks for a name and an email
        for bill emails (`PATCH /v1/me`).
      tags:
        - identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestId:
                  type: string
                  minLength: 1
                  maxLength: 200
                code:
                  type: string
                  pattern: ^[0-9]{4}$
              required:
                - requestId
                - code
      responses:
        '200':
          description: What the code came to.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - signedIn
                      - wrong
                      - expired
                  token:
                    type: string
                    description: '`signedIn` only: the session JWT.'
                  isNew:
                    type: boolean
                    description: '`signedIn` only: no name yet.'
                  user:
                    type: object
                    properties:
                      userId:
                        type: string
                        format: uuid
                      email:
                        type: string
                        description: Where bill emails go; '' if none yet.
                      displayName:
                        type: string
                    required:
                      - userId
                      - email
                      - displayName
                    description: '`signedIn` only.'
                  attemptsLeft:
                    type: integer
                    minimum: 1
                    description: '`wrong` only: tries left on this code.'
                required:
                  - status
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/billing/card:
    delete:
      operationId: removeSavedCard
      summary: Remove the saved card
      description: '#228: detaches the card saved with the last hold. The Stripe customer stays.'
      tags:
        - billing
      responses:
        '204':
          description: Removed (or there was none)
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/billing/fee-charge/{billId}:
    get:
      operationId: getFeeCharge
      summary: The round-ups charge at settle, to confirm it
      description: |
        #228: when the bank wanted the lead to confirm the charge made at settle, this gives the
        page the PaymentIntent's client secret and the saved card. Checks with Stripe, so a
        charge just confirmed comes back `charged`. The lead's own bill only.
      tags:
        - billing
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: billId
          in: path
      responses:
        '200':
          description: The charge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeCharge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/billing/me:
    get:
      operationId: getMyBilling
      summary: The lead's credits this month and the platform fees they've paid
      tags:
        - billing
      responses:
        '200':
          description: Credits and fees
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/billing/table-fee:
    post:
      operationId: startTableFeeCheckout
      summary: Start the £1 hold for a bill
      description: |
        Without a credit, sharing a bill puts a £1 hold on the lead's card (#165): authorised
        now and always released at settle. Creates a Stripe Checkout Session (manual capture)
        for the embedded form (`ui_mode: form`) and returns its client secret. The session is
        for the lead's Stripe customer with `setup_future_usage: off_session` (#228), so the
        card is saved for one charge at settle: the round-ups of the guests the lead marked
        received. The hold is recorded by the Stripe webhook.
      tags:
        - billing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTableFeeRequest'
      responses:
        '200':
          description: Client secret for the embedded form
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableFeeCheckout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The fee for this bill is already paid (`TABLE_FEE_PAID`), or none is due (`TABLE_FEE_WAIVED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Stripe error, or no active price for the fee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/billing/table-fee/{billId}:
    get:
      operationId: getTableFeeStatus
      summary: Whether the table fee for a bill is paid
      description: |
        With `session_id`, an unpaid fee is checked with Stripe directly and recorded if that
        Checkout Session is the caller's, for this bill, and paid. Covers a late or missing webhook.
      tags:
        - billing
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: billId
          in: path
        - schema:
            type: string
            description: The Checkout Session the page just confirmed (`cs_…`).
          required: false
          description: The Checkout Session the page just confirmed (`cs_…`).
          name: session_id
          in: query
        - schema:
            type: string
            description: 'A hold on the saved card the page just confirmed (`pi_…`, #228).'
          required: false
          description: 'A hold on the saved card the page just confirmed (`pi_…`, #228).'
          name: payment_intent
          in: query
      responses:
        '200':
          description: Fee status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableFeeStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/billing/table-fee/saved-card:
    post:
      operationId: holdOnSavedCard
      summary: Place the £1 hold on the saved card
      description: |
        #228: the hold on the card saved with the lead's last hold, in one tap. `held` when the
        bank authorised it; `requires_action` when it wants the lead to confirm (3D Secure):
        the page finishes it with Stripe.js and polls the status with `payment_intent`.
      tags:
        - billing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTableFeeRequest'
      responses:
        '200':
          description: Held, or waiting for the lead to confirm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedCardHold'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The bill already has a hold (`TABLE_FEE_PAID`), or none is due (`TABLE_FEE_WAIVED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The card didn't go through, or a Stripe error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/bills/{billId}:
    get:
      operationId: getBill
      summary: Get a bill (latest version unless ?version is specified)
      tags:
        - bills
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: billId
          in: path
        - schema:
            type: integer
            minimum: 1
            description: Specific version number; omit for latest
          required: false
          description: Specific version number; omit for latest
          name: version
          in: query
      responses:
        '200':
          description: Bill record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/bills/{billId}/amend:
    post:
      operationId: amendBill
      summary: Create a new version of the bill with user edits
      description: |
        Allowed when the bill is either (a) not yet attached to a session, or (b) attached to a session
        in `setup` or `claiming`. Once a session enters `paying`, the bill is frozen.

        When an active session is attached, the amend reconciles in lockstep: the session's
        `pinnedBillVersion` bumps to the new version, claims pointing to removed items are dropped, and
        non-creator participants are un-readied so they re-confirm against the new bill. If the new
        quantity for an item is below the count of claims already attached to it, the call fails with
        `409 CLAIMS_EXCEED_QUANTITY` — the lead must clear those claims (or raise the quantity) first.
        Item IDs are preserved where item identity is preserved.
      tags:
        - bills
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: billId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmendBillRequest'
      responses:
        '200':
          description: New bill version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Bill is frozen (session in `paying` or `settled`), or the amend would orphan existing
            claims (`CLAIMS_EXCEED_QUANTITY`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/bills/{billId}/fork:
    post:
      operationId: forkBill
      summary: Start again with a new bill for the same photo
      description: |
        A new bill (new `billId`, version 1, new item ids) for this bill's photo, with
        `parsedFrom.forkedFrom` naming the bill and version it came from. `from: latest` (the default)
        copies the latest version, so the lead's corrections carry over. `from: analysis` makes it
        from what the current parser read off the photo: the cached read when there is one, else a
        new read, which counts against the daily read limit (429 `RATE_LIMITED`). The photo's hash
        index moves to the new bill, so sending the photo again opens it. The old bill and its
        sessions are untouched. Owner only: anyone else gets 404. Idempotent via `Idempotency-Key`.
      tags:
        - bills
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: billId
          in: path
        - schema:
            type: string
            format: uuid
            description: Client-generated UUIDv7. Cached server-side for 24 hours.
          required: true
          description: Client-generated UUIDv7. Cached server-side for 24 hours.
          name: Idempotency-Key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkBillRequest'
      responses:
        '201':
          description: The new bill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 'Bill not found, or (`from: analysis`) its photo is no longer available'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          description: 'Reading the photo again failed (`from: analysis`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: Upstream parser provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Reading the photo again ran out of time (PARSE_TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/bills/{billId}/image-url:
    get:
      operationId: getBillImageUrl
      summary: Get a short-lived presigned GET URL for the original bill image
      description: |
        Returns a presigned S3 GET URL (TTL ~5 min) for the original uploaded image. Available to the
        bill creator and to any participant of a session this bill is pinned to. Returns 404 NOT_FOUND
        for legacy bills that were parsed before the upload reference was retained.
      tags:
        - bills
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: billId
          in: path
      responses:
        '200':
          description: Presigned URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time
                required:
                  - url
                  - expiresAt
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/bills/parse:
    post:
      operationId: parseBill
      summary: Parse a previously uploaded image into a structured bill
      description: |
        Synchronous call. Fetches the image from S3 (by `uploadId`), runs the configured `BillParser`
        (Claude Sonnet on Amazon Bedrock), validates the parser output with zod, persists `Bill` v1, and indexes
        the image hash. Has 22s, under API Gateway's 30s. The web app uses `POST /v1/bills/reads` instead.
        Idempotent via `Idempotency-Key`.
      tags:
        - bills
      parameters:
        - schema:
            type: string
            format: uuid
            description: Client-generated UUIDv7. Cached server-side for 24 hours.
          required: true
          description: Client-generated UUIDv7. Cached server-side for 24 hours.
          name: Idempotency-Key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseRequest'
      responses:
        '200':
          description: Parsed bill. When the photo is one this user read before, their own latest version of that bill, with `duplicate` saying where it stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsedBill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Upload not found or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          description: Parser returned but output failed validation, or confidence below threshold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: Upstream parser provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Reading the bill ran out of time (PARSE_TIMEOUT). The upload is kept, so the same uploadId can be parsed again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/bills/reads:
    post:
      operationId: startBillRead
      summary: Start reading an uploaded image in the background
      description: |
        Same read as `POST /v1/bills/parse`, but it runs in the background (with 45s rather than 22s)
        and this returns at once. Poll `GET /v1/bills/reads/{readId}` until it's `done` (open `billId`)
        or `failed` (the same error the synchronous parse would have returned). Idempotent via
        `Idempotency-Key`.
      tags:
        - bills
      parameters:
        - schema:
            type: string
            format: uuid
            description: Client-generated UUIDv7. Cached server-side for 24 hours.
          required: true
          description: Client-generated UUIDv7. Cached server-side for 24 hours.
          name: Idempotency-Key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseRequest'
      responses:
        '202':
          description: Reading has started (or, if it couldn't be started, has already failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillRead'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /v1/bills/reads/{readId}:
    get:
      operationId: getBillRead
      summary: How a background read is going
      description: |
        Only the user who started the read can see it. A read still `reading` after 90s is reported as
        `failed` with `PARSE_TIMEOUT`. Reads are kept for a day.
      tags:
        - bills
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: readId
          in: path
      responses:
        '200':
          description: The read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such read for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/bills/uploads:
    post:
      operationId: requestBillUpload
      summary: Request a pre-signed S3 PUT URL for a bill image
      description: |
        Two-step upload: client computes SHA-256 of the resized image bytes and calls this endpoint.
        If the hash is already mapped to one of this user's bills, returns `{ status: "duplicate", billId }`
        with where that bill stands (`versionNumber`, `amended`, `session`), and no S3 upload is needed. Otherwise returns a short-lived (5-minute) pre-signed PUT URL with
        scoped permissions (specific key, content-length cap, PUT only).
      tags:
        - bills
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '200':
          description: Upload slot or duplicate-bill resolution
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UploadSlot'
                  - $ref: '#/components/schemas/UploadDuplicate'
                discriminator:
                  propertyName: status
                  mapping:
                    new: '#/components/schemas/UploadSlot'
                    duplicate: '#/components/schemas/UploadDuplicate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/links/{token}:
    get:
      operationId: getBillLink
      summary: The bill behind a link in a guest's text (#220 G5)
      description: |
        No sign-in: the random token is the key. Read-only and live: who had
        what, who's paid, the guest the link was sent to (`isYou`), and what
        nobody claimed. Never any phone number or bank details (ADR-0002).
        Works for 30 days after the last text; then 404. 60 lookups per IP
        per 10 minutes.
      tags:
        - links
      security: []
      parameters:
        - schema:
            type: string
            maxLength: 64
            description: The random token from a guest's text
          required: true
          description: The random token from a guest's text
          name: token
          in: path
      responses:
        '200':
          description: The bill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillLinkView'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/links/{token}/stop:
    post:
      operationId: stopReminders
      summary: Stop reminder texts for this bill (#219)
      description: |
        From `/s/{token}` in a reminder (a named sender can't take STOP
        replies). The guest gets no more reminders about this bill.
        Idempotent.
      tags:
        - links
      security: []
      parameters:
        - schema:
            type: string
            maxLength: 64
            description: The random token from a guest's text
          required: true
          description: The random token from a guest's text
          name: token
          in: path
      responses:
        '200':
          description: Stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  stopped:
                    type: boolean
                required:
                  - stopped
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the verified caller
      tags:
        - identity
      responses:
        '200':
          description: The authenticated user, derived from the verified ID token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateCurrentUser
      summary: Set your name and the email bill emails go to
      description: |
        #213. A phone account has no name or email until it sets them. The
        email is only where bill emails go, not a way to sign in; '' removes
        it. Answers with a fresh session JWT, since the name travels in it.
        Guests (#183) can't.
      tags:
        - identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 40
                email:
                  anyOf:
                    - type: string
                      maxLength: 254
                      format: email
                    - type: string
                      enum:
                        - ''
              additionalProperties: false
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      userId:
                        type: string
                      email:
                        type: string
                      displayName:
                        type: string
                    required:
                      - userId
                      - email
                      - displayName
                required:
                  - token
                  - user
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/payout-account:
    put:
      operationId: setMyPayoutAccount
      summary: '[DEPRECATED] Accepted but no longer persisted'
      description: |
        **Deprecated.** Per ADR-0002, the lead's bank details are now device-local
        and exchanged peer-to-peer via QR — never stored server-side. This endpoint
        still validates the body and returns 200 echoing the supplied account for
        compatibility with older clients, but it no longer persists anything.

        New clients should not call this. The endpoint will be removed in a future
        release.
      deprecated: true
      tags:
        - identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutAccount'
      responses:
        '200':
          description: |
            Always returned for valid bodies. The supplied account is echoed back
            but **not** persisted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payoutAccount:
                    $ref: '#/components/schemas/PayoutAccount'
                required:
                  - payoutAccount
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/sessions:
    get:
      operationId: listMySessions
      summary: List sessions the caller has been part of, most recent first
      description: |
        Returns lightweight summaries (no participants list) for sessions where the caller is the
        creator or a joined diner. Sessions are sorted by sessionId descending — UUIDv7 is time-ordered
        so the newest comes first. The full session can be fetched via GET /v1/sessions/{id}.
      tags:
        - identity
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            description: Maximum number of summaries to return (1–100, defaults to 20).
          required: false
          description: Maximum number of summaries to return (1–100, defaults to 20).
          name: limit
          in: query
      responses:
        '200':
          description: List of session summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionSummary'
                required:
                  - sessions
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/sign-out:
    post:
      operationId: signOutEverywhere
      summary: Sign out everywhere
      description: |
        Ends every session token this user holds, on every device: tokens
        minted before this call get `401 AUTH_INVALID` from then on. The
        web app's Sign out calls it.
      tags:
        - identity
      responses:
        '200':
          description: Signed out everywhere.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/payments/{paymentId}:
    get:
      operationId: getPayment
      summary: Get a payment record
      description: |
        Caller must be the payer or the collector for this payment.
      tags:
        - payments
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: paymentId
          in: path
      responses:
        '200':
          description: Payment record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not authorized to view this payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/payments/{paymentId}/confirm:
    post:
      operationId: confirmManualPayment
      summary: Collector confirms a manual payment was received
      description: |
        The collector marks a guest payment as `succeeded` after seeing the funds arrive in
        their bank account. Idempotent — confirming a payment already in `succeeded` returns
        the same payment unchanged.
      tags:
        - payments
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: paymentId
          in: path
      responses:
        '200':
          description: Payment, now in `succeeded`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Payment not found, or caller is not the collector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Payment is in a state that can't be confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/payments/{paymentId}/mark-paid:
    post:
      operationId: markPaymentPaidByPayer
      summary: Payer claims they've sent the money via their banking app
      description: |
        Payer-only. Idempotent — re-claiming returns the same `payerClaimedPaidAt` timestamp.
        **Does not advance payment status** — only the lead's `/confirm` does that. This claim
        exists purely as a UX signal: the lead's session view can flag pending payments where
        the payer says they've already paid, so the lead knows which ones to confirm next.
      tags:
        - payments
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: paymentId
          in: path
      responses:
        '200':
          description: Payment with `payerClaimedPaidAt` set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Payment not found, or caller is not the payer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Payment is not in `pending` (e.g. already succeeded or failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions:
    post:
      operationId: createSession
      summary: Create a session from a bill
      description: |
        The caller becomes both the creator and the collector. The session starts in `setup`. The join
        code is generated but not returned by this endpoint and not visible until `/share` is called.
      tags:
        - sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The bill already has an open session (`SESSION_INVALID_STATE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{sessionId}:
    get:
      operationId: getSession
      summary: Get session state including participants
      description: |
        For non-creator callers in `setup`, the `joinCode` field is omitted from the response.
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      responses:
        '200':
          description: Session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateSession
      summary: Change how many people the lead expects at the table
      description: |
        Lead only. Sets `expectedDiners` (lead included), or clears it with
        `null`. Allowed until the bill is closed or deleted. Display only:
        it never changes what anyone owes.
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: Session with the new value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The bill is closed or deleted (`SESSION_INVALID_STATE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{sessionId}/abandon:
    post:
      operationId: abandonSession
      summary: Creator marks the session abandoned (terminal)
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      responses:
        '200':
          description: Session, now in `abandoned`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the creator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session is already `settled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{sessionId}/claims:
    post:
      operationId: setClaims
      summary: Replace the current user's claim list
      description: |
        Full replacement (not delta). Caller must be the creator (in `setup`) or a participant (in
        `claiming`). Items can be claimed by multiple participants; the cost is split equally with
        rounding pennies allocated deterministically at `lock-claims` time.
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimsRequest'
      responses:
        '200':
          description: Session reflecting the updated claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session is in a state where claims cannot be modified by this caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{sessionId}/close:
    post:
      operationId: closeSession
      summary: Creator closes the bill (session becomes `settled`)
      description: |
        "I've stopped waiting at the table." Anything still unclaimed is the
        creator's by implication. Guests who still owe can pay afterwards.
        Every diner is emailed their bill report (see `emailSessionReport`).
        Idempotent: closing a settled session returns it unchanged and sends
        nothing.
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      responses:
        '200':
          description: Session, now in `settled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session is `setup` or `abandoned`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{sessionId}/comments:
    get:
      operationId: listComments
      summary: The bill's comments, oldest first
      description: |
        Anyone at the table (#218). Text only; at most the latest 200. Kept with the session and
        gone when it expires (30 days).
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      responses:
        '200':
          description: Comments, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                required:
                  - comments
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session not found, or caller isn't at the table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: postComment
      summary: Write a comment on the bill
      description: |
        Anyone at the table (#218), e.g. "Sent mine by Monzo". Plain text, trimmed, 1–280
        characters; never turned into links. 30 per person per bill per hour.
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCommentRequest'
      responses:
        '201':
          description: The comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session not found, or caller isn't at the table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The bill was deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/sessions/{sessionId}/join:
    post:
      operationId: joinSession
      summary: Current user joins the session
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      responses:
        '200':
          description: Session including the new participant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session is not in `claiming`, or user already a participant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{sessionId}/lock-claims:
    post:
      operationId: lockClaims
      summary: Creator locks claims and transitions claiming -> paying
      description: |
        Creator-only. All bill items must be claimed by ≥1 participant; otherwise returns
        `409 CLAIMS_INCOMPLETE` with the list of unclaimed item IDs in `details`.

        All non-creator participants must have `readyToLock: true` (set via
        `POST /ready`); otherwise returns `409 PARTICIPANTS_NOT_READY` with
        the list of un-ready user IDs in `details`. The order of these
        checks: items completeness first, then readiness.

        Pass `force: true` in the body to skip the readiness precondition
        (e.g. a guest dropped off). Items completeness is always required.

        On success, computes `owedPence` for every participant and freezes
        claims.
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Skip the readiness precondition.
      responses:
        '200':
          description: Session, now in `paying` with `owedPence` computed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the creator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            One of: session not in `claiming`, items unclaimed
            (`CLAIMS_INCOMPLETE`), or participants not ready
            (`PARTICIPANTS_NOT_READY`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{sessionId}/open-payments:
    post:
      operationId: openPayments
      summary: The lead opens payments before every line is claimed
      description: |
        Lead only (#216). Payments open by themselves once every line is claimed (every unit,
        every spot in a split); this opens them early. Sets `paymentsOpenedAt`. Amounts don't
        change, and whatever nobody has claimed is the lead's at settle. Idempotent: the first
        time is kept.
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      responses:
        '200':
          description: Session, with `paymentsOpenedAt`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session not found, or caller is not the lead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Session is in setup, closed or deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{sessionId}/participants/{userId}/received:
    post:
      operationId: markParticipantReceived
      summary: Collector marks everything a guest owes as received
      description: |
        For when the lead sees the transfer land (a banking app notification) before, or
        instead of, the guest saying they've paid. Confirms every payment the guest says
        they've sent, closes one opened but not sent, and records the rest of what they owe
        now as one more payment, already `succeeded`, so the guest is settled. Idempotent:
        with nothing left to collect it changes nothing. A guest who claims more afterwards
        owes the difference, as with any top-up.

        #220: a guest who verified a number when they joined (#214) gets one
        text saying it arrived, with a link to the bill (`/b/{token}`, 30 days).
        Once per guest per bill; never more than 30 texts a bill.
      tags:
        - payments
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
        - schema:
            type: string
            description: The guest whose money arrived
          required: true
          description: The guest whose money arrived
          name: userId
          in: path
      responses:
        '200':
          description: Session, with the guest paid up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session or guest not found, or caller is not the collector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Session is in setup or deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{sessionId}/participants/{userId}/remind:
    post:
      operationId: remindGuest
      summary: The lead texts a guest who still owes a reminder (#219)
      description: |
        One text by AWS SMS: what they owe, the bill's link
        (`/b/{token}`) and a link to stop reminders (`/s/{token}`). At most
        one a day per guest and three in all (the automatic one counts),
        and never more than 30 texts a bill. 429 when it's too soon or used
        up; 409 when the guest can't be reminded (paid, no number, opted
        out, payments not open); 503 where texts are off.
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
        - schema:
            type: string
            description: The guest to remind
          required: true
          description: The guest to remind
          name: userId
          in: path
      responses:
        '200':
          description: Sent; the guest's reminder state now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestRemind'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: This guest can't be reminded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Texts aren't available here
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{sessionId}/payments:
    post:
      operationId: initiatePayment
      summary: Initiate a payment from the current participant to the collector
      description: |
        The current user must be a guest at the table, and payments must be open: every line claimed
        (every unit, every spot in a split), the lead has opened them early (`open-payments`), or the
        bill is locked or closed. Otherwise `409 PAYMENTS_NOT_OPEN` with the unclaimed item IDs in
        `details`. Pays what the guest owes now less what they've already sent (#121). Returns the
        payment record and the details the guest pays with from their own banking app.
      tags:
        - payments
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
        - schema:
            type: string
            format: uuid
            description: Client-generated UUIDv7. Cached server-side for 24 hours.
          required: true
          description: Client-generated UUIDv7. Cached server-side for 24 hours.
          name: Idempotency-Key
          in: header
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiatePaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a participant in this session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Payments not open yet (`PAYMENTS_NOT_OPEN`), session in setup or deleted, or nothing to pay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{sessionId}/payout-check:
    put:
      operationId: setSessionPayoutCheck
      summary: The lead publishes a fingerprint of the bank details in their join link
      description: |
        The lead's device sends `payoutCheck`, a PBKDF2 fingerprint of the bank
        details it puts in the join link's `#p=` fragment, salted with the session
        id. The details themselves never reach the server (ADR-0002). Guests' apps
        recompute it from the link and warn when it doesn't match, so a re-posted
        link with someone else's details is caught (#151). Lead only, until the
        bill is closed.
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payoutCheck:
                  type: string
                  pattern: ^[0-9a-f]{64}$
              required:
                - payoutCheck
              additionalProperties: false
      responses:
        '200':
          description: The session, with `payoutCheck`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The bill is closed (`SESSION_INVALID_STATE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{sessionId}/proofs:
    get:
      operationId: listProofs
      summary: Proof-of-payment screenshots
      description: |
        The lead gets every guest's; a guest gets their own (#226). Sent ones only, oldest first,
        each with a signed URL that lasts 5 minutes.
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      responses:
        '200':
          description: Screenshots
          content:
            application/json:
              schema:
                type: object
                properties:
                  proofs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Proof'
                required:
                  - proofs
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session or screenshot not found, or caller isn't at the table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: startProof
      summary: Start uploading a proof-of-payment screenshot
      description: |
        A guest (not the lead) at a live bill (#226). The browser crops the screenshot and
        re-encodes it as JPEG (no EXIF) first; only that is uploaded, with a presigned PUT
        (`content-type: image/jpeg`, exactly `sizeBytes`, at most 2 MB, 5 minutes). Then call
        `…/proofs/{proofId}/sent`. At most 3 per guest per bill; deleted after 30 days.
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartProofRequest'
      responses:
        '201':
          description: Where to PUT the image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofUploadSlot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session or screenshot not found, or caller isn't at the table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The bill is deleted or not shared yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/sessions/{sessionId}/proofs/{proofId}:
    delete:
      operationId: deleteProof
      summary: Remove your screenshot
      description: The guest who sent it (#226). Deletes the image too.
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
        - schema:
            type: string
            format: uuid
          required: true
          name: proofId
          in: path
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session or screenshot not found, or caller isn't at the table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{sessionId}/proofs/{proofId}/sent:
    post:
      operationId: proofSent
      summary: The screenshot has uploaded
      description: Checks the object is there, then shows it to the lead (#226). Idempotent.
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
        - schema:
            type: string
            format: uuid
          required: true
          name: proofId
          in: path
      responses:
        '200':
          description: The screenshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proof'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session or screenshot not found, or caller isn't at the table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Nothing uploaded yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{sessionId}/ready:
    post:
      operationId: setReady
      summary: Non-creator participant signals 'I'm done claiming'
      description: |
        Per-diner readiness flag used by the hybrid claim model. Each guest
        toggles this when they're done claiming items; the lead's lock-claims
        precondition checks all non-creator participants are ready (unless
        `force: true`). The creator cannot use this endpoint — they signal
        readiness implicitly via `lock-claims`.

        Editing claims (`POST /claims`) un-readies the participant.
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ready:
                  type: boolean
              required:
                - ready
      responses:
        '200':
          description: Session, with the caller's readyToLock flipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session not in `claiming`, or caller is the creator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{sessionId}/receipt:
    post:
      operationId: emailReceipt
      summary: A guest has their receipt emailed (#220)
      description: |
        From *All square*: what they had, their part of service and the
        discount, and what they paid. No bank details. Not a sign-in and not
        saved to an account: the address is kept with the bill only and goes
        with it. Three sends per guest per bill, five a day to any one
        address. Not for the lead (their report is `/report`).
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
              required:
                - email
      responses:
        '202':
          description: Receipt sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: boolean
                required:
                  - sent
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session is `setup` or `abandoned`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/sessions/{sessionId}/report:
    post:
      operationId: emailSessionReport
      summary: Email the caller their bill report
      description: |
        The lead's report lists every diner (themselves included): what each
        had, their share of service and tax, and whether they've paid. A
        guest's lists only what they had and paid. Works while the bill is
        open (current state) and after it's closed. Nobody is emailed
        automatically at close (#221: the lead's comes the next morning).
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      responses:
        '202':
          description: Report sent to the caller's email
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: boolean
                required:
                  - sent
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session is `setup` or `abandoned`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{sessionId}/share:
    post:
      operationId: shareSession
      summary: Creator transitions setup -> claiming, freezing their own claims
      description: |
        Creator-only. Transitions the session from `setup` to `claiming`. Freezes the creator's
        `claimedItemIds` and sets the creator's `payment.status` to `self_paid`. Activates the join code
        (subsequent calls to `/by-code` will resolve it).

        Per ADR-0002 the creator's bank details aren't needed here: they live on the device and
        reach guests via the join QR.

        When the platform fee is on (Stripe configured), sharing needs one of: the bill's paid fee
        (not refunded, not spent on another session), an exempt lead, or the lead's credit for the
        month (one free bill a month, UK time). The fee or credit is spent in the same transaction
        as the share. Otherwise `402 TABLE_FEE_REQUIRED`.
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                checkoutSessionId:
                  type: string
                  description: The Checkout Session just paid (`cs_...`), checked with Stripe if the webhook is late.
      responses:
        '200':
          description: Session, now in `claiming` with the join code visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: No paid fee, exemption or credit for this share (`TABLE_FEE_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not the creator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session is not in `setup`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{sessionId}/shares:
    post:
      operationId: addShare
      summary: Caller joins the splitter set for a shared item (ADR-0006)
      description: |
        Adds the caller to the share set for `itemId`. Idempotent — calling
        twice has no effect on the second call.

        The item is divided into `ways` equal spots and each sharer owes one
        spot (largest-remainder rounding, remainder pennies to the lowest
        userId). Whoever *starts* the split sets `ways` (default 2) — it's
        how many people shared the item, not how many have joined yet.
        Joining an existing split takes an open spot; if every spot is
        already taken, `ways` goes up by one (refused with `SHARE_PAID` if
        someone in the split has already paid). Spots nobody has taken are
        unclaimed.

        On a line with more than one of something the split covers
        `units` of it (default: every unit nobody has claimed), and each
        sharer owes unitPrice × units / ways. The rest of the line can
        still be claimed one at a time. A quantity-1 item is in exactly one
        mode session-wide — claim-mode (unit claims via `/claims`) or
        share-mode.

        Splitting an item someone else has claimed (#130) turns their claim
        into their spot in a new split with the caller, `ways` (default 2),
        at once: they're told, not asked. The split's `activity` records it
        as `split`, `fromUserId` the former claimer.

        - `409 SESSION_INVALID_STATE` if `units` is more than is left
          unclaimed on the line,
        - `409 CLAIM_SHARE_CONFLICT` if the caller has claimed it
          themselves (remove the claim first), or
        - `409 SHARE_PAID` if the person who claimed it has paid.

        Editing the caller's share set un-readies them (same rule as
        `/claims`).
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                itemId:
                  type: string
                  format: uuid
                ways:
                  type: integer
                  minimum: 2
                  maximum: 20
                  description: How many people shared the item. Only read when starting the split.
                units:
                  type: integer
                  minimum: 1
                  maximum: 999
                  description: How many of a multi-quantity line the split covers. Only read when starting the split; defaults to every unit nobody has claimed. Always 1 on a quantity-1 line.
              required:
                - itemId
      responses:
        '200':
          description: Updated session, with the caller now in the splitter set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Session is not in setup/claiming or there aren't `units` left
            unclaimed (`SESSION_INVALID_STATE`), the caller has claimed it
            (`CLAIM_SHARE_CONFLICT`), the split is full and someone in it
            has paid or the person who claimed it has paid (`SHARE_PAID`),
            or a concurrent edit kept winning
            (`SHARE_CONFLICT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{sessionId}/shares/{itemId}:
    put:
      operationId: setShareWays
      summary: Someone in a split changes how many ways it is divided
      description: |
        Only people in the split may call this. `ways` can't go below the
        number of people already in it (`SHARE_WAYS_TOO_LOW`) and can't
        change once anyone in it has a pending or succeeded payment
        (`SHARE_PAID`). Recorded in the split's `activity` so the others
        in it can be told.
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
        - schema:
            type: string
            format: uuid
          required: true
          name: itemId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ways:
                  type: integer
                  minimum: 2
                  maximum: 20
              required:
                - ways
      responses:
        '200':
          description: Updated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Caller isn't in the split (`SHARE_CONFLICT`), `ways` is below the
            number of people in it (`SHARE_WAYS_TOO_LOW`), someone in it has
            paid (`SHARE_PAID`), or the session isn't in setup/claiming.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: removeShare
      summary: Caller leaves the splitter set for a shared item (ADR-0006)
      description: |
        Removes the caller from the share set for `itemId`. Idempotent —
        no-op if not in the set. The number of ways stays the same (the
        caller's spot reopens). If the caller is the last sharer, the
        item reverts to no-share-at-all.
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
        - schema:
            type: string
            format: uuid
          required: true
          name: itemId
          in: path
      responses:
        '200':
          description: Updated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session is in a state where shares cannot be modified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/{sessionId}/texts:
    get:
      operationId: getGuestTexts
      summary: What Remind can do for each guest (#219)
      description: |
        The lead only. Per guest: `ready` (*Remind* sends a text), `today`
        (reminded in the last day), `used_up` (three reminders sent),
        `stopped` (they opted out), `no_number`, `not_owed` or `not_open`
        (payments aren't open yet). `enabled: false` where texts are off.
        Never a phone number.
      tags:
        - sessions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      responses:
        '200':
          description: Reminder state per guest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestTexts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sessions/by-code:
    post:
      operationId: resolveJoinCode
      summary: Resolve a 6-character join code to a session ID
      description: |
        Only resolves sessions in `claiming` state. Codes for `setup` sessions are not active.
        At most 30 lookups per user every 10 minutes (429 `RATE_LIMITED` with
        `details.retryAfterSeconds`), so codes can't cheaply be guessed.
      tags:
        - sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinByCodeRequest'
      responses:
        '200':
          description: Resolved session id
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                    format: uuid
                required:
                  - sessionId
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Code not found, expired, or attached to a non-claiming session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many codes tried (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/guest-join:
    post:
      operationId: guestJoin
      summary: Join a bill with a name (and a verified number), no account
      description: |
        Guests have no account (#183). Seats a new guest at the table and returns a
        session token that works for this one session only (its own session, the
        bill it's pinned to, its payments, and `GET /v1/me`; anything else is 401 `AUTH_MISSING`).
        At most 20 per IP address an hour, and 60 per table an hour.

        #214: where texts are on (`GET /v1/auth/methods` says `sms: true`), the
        guest first gets a 4-digit code from `POST /v1/sessions/guest-join/start`
        and sends `requestId` and `phoneCode` here; without them it's 400. A
        wrong or expired code answers 200 with `status: wrong` (and
        `attemptsLeft`) or `status: expired`. The number is kept for the bill's
        texts, apart from the session, and never shown to anyone at the table.
      tags:
        - sessions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestJoinRequest'
      responses:
        '200':
          description: The code was wrong or has expired (#214)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestJoinCodeRefused'
        '201':
          description: Seated; keep the token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestJoinResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Unknown token, or a bill that isn't taking new people
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many joins (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/guest-join/start:
    post:
      operationId: guestJoinStart
      summary: Text a guest the code that proves their number
      description: |
        #214. Only for a bill taking people (`claiming`). Texts a 4-digit code
        (10 minutes, 5 tries) to a UK mobile, through AWS End User Messaging
        SMS (#231). The same limits as phone sign-in: 3 an hour per number,
        30 seconds apart, 10 an hour per IP address, 200 an hour in all
        (429 `RATE_LIMITED`). 503 `CHANNEL_UNAVAILABLE` where texts are off.
      tags:
        - sessions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestJoinStartRequest'
      responses:
        '200':
          description: Sent; `requestId` is this tab's secret for the code
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  phone:
                    type: string
                    description: The number in E.164
                required:
                  - requestId
                  - phone
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Unknown token, or a bill that isn't taking new people
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many codes (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Texts aren't on here (`CHANNEL_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/sessions/preview:
    post:
      operationId: previewSession
      summary: What the QR's landing page shows before anyone joins
      description: |
        For whoever holds the QR (#183): host first name, venue, date, item count,
        total incl. service and the first names of everyone at the table. Nothing
        about bank details (ADR-0002). No sign-in; at most 60 per IP address every
        10 minutes.
      tags:
        - sessions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinByCodeRequest'
      responses:
        '200':
          description: The bill as the landing page shows it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Unknown token, or a bill that isn't open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many tries from this address (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webhooks/stripe:
    post:
      operationId: stripeWebhook
      summary: Stripe event webhook
      description: |
        Verified with the `Stripe-Signature` header and `STRIPE_WEBHOOK_SECRET`.
        `checkout.session.completed` (and `checkout.session.async_payment_succeeded`) with
        `payment_status: paid` records the bill's table fee. #228:
        `payment_intent.amount_capturable_updated` records a hold on the saved card, and
        `payment_intent.succeeded` a round-ups charge the lead confirmed. Every verified event gets `200`,
        including repeats; an invalid signature gets `401`.
      tags:
        - webhooks
      security: []
      responses:
        '200':
          description: Event accepted
        '401':
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
webhooks: {}
