# Regenerates the visual snapshot baselines on the same runner CI uses and
# uploads them. Download the artifact and commit apps/web/e2e/visual.spec.ts-snapshots/.
name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baselines:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test visual --project=desktop --update-snapshots
        working-directory: apps/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baselines
          path: apps/web/e2e/visual.spec.ts-snapshots/
      # Commit the new baselines back to the branch it ran on, so a design
      # change needs no download-and-commit by hand. Never on main.
      - name: Commit baselines to the branch
        if: github.ref_name != 'main'
        run: |
          git config user.name "caldvs"
          git config user.email "42970938+caldvs@users.noreply.github.com"
          git add apps/web/e2e/visual.spec.ts-snapshots/
          if git diff --cached --quiet; then echo "Baselines unchanged"; exit 0; fi
          git commit -m "Update visual baselines"
          git push
