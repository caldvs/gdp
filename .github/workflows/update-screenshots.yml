# Regenerates the visual snapshot baselines on the same runner CI uses and
# uploads them. Download the artifact and commit apps/web/e2e/visual.spec.ts-snapshots/.
name: Update screenshot baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      playwright: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: v
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  baselines:
    needs: version
    runs-on: ubuntu-24.04
    # The same image CI's e2e shards run in, so the screenshots match.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.version.outputs.playwright }}-noble
    env:
      HOME: /root
    steps:
      # Checkout needs git for a real clone, and the last step commits.
      - run: command -v git || { apt-get update -qq && apt-get install -y -qq git; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/npm-ci
        with:
          key: playwright-${{ needs.version.outputs.playwright }}
      - run: npm run build -w apps/web
      - run: npx playwright test visual --project=desktop --update-snapshots
        working-directory: apps/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baselines
          path: apps/web/e2e/visual.spec.ts-snapshots/
      # Commit the new baselines back to the branch it ran on, so a design
      # change needs no download-and-commit by hand. Never on main.
      - name: Commit baselines to the branch
        if: github.ref_name != 'main'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "caldvs"
          git config user.email "42970938+caldvs@users.noreply.github.com"
          git add apps/web/e2e/visual.spec.ts-snapshots/
          if git diff --cached --quiet; then echo "Baselines unchanged"; exit 0; fi
          git commit -m "Update visual baselines"
          git push
