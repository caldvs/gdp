openapi: 3.1.0
info:
  title: Group Dine Pay API
  version: 0.1.0
  summary: Group restaurant bill splitting and Open Banking settlement.
  description: |
    Backend for the Group Dine Pay mobile app.

    ## Conventions

    - **All money is integer pence (GBP).** No floats anywhere on the wire.
    - **All identifiers are UUIDv7** unless documented otherwise.
    - **Timestamps are RFC 3339** strings.
    - **Auth** uses Google ID tokens (`Authorization: Bearer <jwt>`). The server verifies the token signature, audience, and expiry on every request to a `/v1/*` endpoint and trusts only the verified `sub` claim. Any `userId` in a request body is ignored.
    - **Errors** use a single envelope (`ErrorResponse`). `error.code` is the stable identifier; `error.message` is human-safe.
    - **Idempotency** is required on every state-changing payment endpoint via the `Idempotency-Key` header. Same key + same body returns the cached response; same key + different body returns `409 IDEMPOTENCY_CONFLICT`.
    - **Versioning** is path-based (`/v1/...`). Multiple versions may run in parallel.

  contact:
    name: Group Dine Pay
  license:
    name: Proprietary

servers:
  - url: https://api.gdp.example.com
    description: production (placeholder until deploy)
  - url: http://localhost:3000
    description: local development

security:
  - bearerAuth: []

tags:
  - name: identity
    description: The authenticated caller
  - name: bills
    description: Photographing, parsing, retrieving, and amending bills
  - name: sessions
    description: Group dining sessions, the join flow, and claim management
  - name: payments
    description: Open Banking payments from participants to the collector
  - name: webhooks
    description: Server-to-server callbacks from payment providers
  - name: ops
    description: Health and readiness probes

paths:
  /healthz:
    get:
      tags: [ops]
      operationId: healthcheck
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /readyz:
    get:
      tags: [ops]
      operationId: readiness
      summary: Readiness probe (checks DDB and S3 connectivity)
      security: []
      responses:
        '200':
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status: { type: string, const: ok }
                  checks:
                    type: object
                    properties:
                      ddb: { type: string, enum: [ok, fail] }
                      s3: { type: string, enum: [ok, fail] }
        '503':
          description: One or more dependencies are unhealthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/me:
    get:
      tags: [identity]
      operationId: getCurrentUser
      summary: Get the verified caller
      responses:
        '200':
          description: The authenticated user, derived from the verified ID token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/bills/uploads:
    post:
      tags: [bills]
      operationId: requestBillUpload
      summary: Request a pre-signed S3 PUT URL for a bill image
      description: |
        Two-step upload: client computes SHA-256 of the resized image bytes and calls this endpoint.
        If the hash is already mapped to a parsed bill, returns `{ status: "duplicate", billId }` and
        no S3 upload is needed. Otherwise returns a short-lived (5-minute) pre-signed PUT URL with
        scoped permissions (specific key, content-length cap, PUT only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadRequest' }
      responses:
        '200':
          description: Upload slot or duplicate-bill resolution
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UploadSlot'
                  - $ref: '#/components/schemas/UploadDuplicate'
                discriminator:
                  propertyName: status
                  mapping:
                    new: '#/components/schemas/UploadSlot'
                    duplicate: '#/components/schemas/UploadDuplicate'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/bills/parse:
    post:
      tags: [bills]
      operationId: parseBill
      summary: Parse a previously uploaded image into a structured bill
      description: |
        Synchronous call. Fetches the image from S3 (by `uploadId`), runs the configured `BillParser`
        (Gemini 2.5 Flash for v0), validates the parser output with zod, persists `Bill` v1, and indexes
        the image hash. Idempotent via `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParseRequest' }
      responses:
        '200':
          description: Parsed bill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Upload not found or expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422':
          description: Parser returned but output failed validation, or confidence below threshold
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502':
          description: Upstream parser provider error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/bills/{billId}:
    parameters:
      - $ref: '#/components/parameters/BillId'
    get:
      tags: [bills]
      operationId: getBill
      summary: Get a bill (latest version unless ?version is specified)
      parameters:
        - in: query
          name: version
          schema: { type: integer, minimum: 1 }
          description: Specific version number; omit for latest
      responses:
        '200':
          description: Bill record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/bills/{billId}/amend:
    parameters:
      - $ref: '#/components/parameters/BillId'
    post:
      tags: [bills]
      operationId: amendBill
      summary: Create a new version of the bill with user edits
      description: |
        Allowed only when the bill is either (a) not yet attached to a session, or (b) attached to a
        session in `setup` or `claiming`. Once a session enters `paying`, the bill is frozen.
        Item IDs are preserved where item identity is preserved; deleted items invalidate any claims
        attached to them and the affected participants must re-claim.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmendBillRequest' }
      responses:
        '200':
          description: New bill version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Bill is frozen (session in `paying` or `settled`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Create a session from a bill
      description: |
        The caller becomes both the creator and the collector. The session starts in `setup`. The join
        code is generated but not returned by this endpoint and not visible until `/share` is called.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Bill not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/sessions/by-code:
    post:
      tags: [sessions]
      operationId: resolveJoinCode
      summary: Resolve a 6-character join code to a session ID
      description: Only resolves sessions in `claiming` state. Codes for `setup` sessions are not active.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinByCodeRequest' }
      responses:
        '200':
          description: Resolved session id
          content:
            application/json:
              schema:
                type: object
                required: [sessionId]
                properties:
                  sessionId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Code not found, expired, or attached to a non-claiming session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [sessions]
      operationId: getSession
      summary: Get session state including participants
      description: |
        For non-creator callers in `setup`, the `joinCode` field is omitted from the response.
      responses:
        '200':
          description: Session state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sessions/{sessionId}/share:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: shareSession
      summary: Creator transitions setup -> claiming, freezing their own claims
      description: |
        Creator-only. Transitions the session from `setup` to `claiming`. Freezes the creator's
        `claimedItemIds` and sets the creator's `payment.status` to `self_paid`. Activates the join code
        (subsequent calls to `/by-code` will resolve it).
      responses:
        '200':
          description: Session, now in `claiming` with the join code visible
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the creator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Session is not in `setup`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/sessions/{sessionId}/join:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: joinSession
      summary: Current user joins the session
      responses:
        '200':
          description: Session including the new participant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Session is not in `claiming`, or user already a participant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/sessions/{sessionId}/claims:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: setClaims
      summary: Replace the current user's claim list
      description: |
        Full replacement (not delta). Caller must be the creator (in `setup`) or a participant (in
        `claiming`). Items can be claimed by multiple participants; the cost is split equally with
        rounding pennies allocated deterministically at `lock-claims` time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimsRequest' }
      responses:
        '200':
          description: Session reflecting the updated claims
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Session is in a state where claims cannot be modified by this caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/sessions/{sessionId}/lock-claims:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: lockClaims
      summary: Creator locks claims and transitions claiming -> paying
      description: |
        Creator-only. All bill items must be claimed by ≥1 participant; otherwise returns
        `409 CLAIMS_INCOMPLETE` with the list of unclaimed item IDs in `details`. On success, computes
        `owedPence` for every participant and freezes claims.
      responses:
        '200':
          description: Session, now in `paying` with `owedPence` computed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the creator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Session not in `claiming`, or items unclaimed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/sessions/{sessionId}/abandon:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: abandonSession
      summary: Creator marks the session abandoned (terminal)
      responses:
        '200':
          description: Session, now in `abandoned`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the creator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Session is already `settled`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/sessions/{sessionId}/payments:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [payments]
      operationId: initiatePayment
      summary: Initiate a payment from the current participant to the collector
      description: |
        The current user must be a participant in the session, the session must be in `paying`, and the
        participant's current `payment.status` must be `unpaid` or `failed`. Returns the created payment
        record with a TrueLayer redirect URL the client should open to complete the authentication.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Payment created and authorized with TrueLayer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InitiatePaymentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not a participant in this session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Session not in `paying`, or payment status not unpaid/failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: TrueLayer error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/payments/{paymentId}:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
    get:
      tags: [payments]
      operationId: getPayment
      summary: Get a payment record
      description: |
        Caller must be the payer or the collector for this payment.
      responses:
        '200':
          description: Payment record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not authorized to view this payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/truelayer:
    post:
      tags: [webhooks]
      operationId: truelayerWebhook
      summary: TrueLayer payment-status webhook
      description: |
        Provider-to-server callback. Authentication is via TrueLayer's `Tl-Signature` header
        (request signing scheme) verified using TrueLayer's public JWKS. The body is provider-defined;
        we resolve `providerPaymentId` to our `paymentId` via GSI2 and apply the state transition.

        Returns `200` for accepted updates (idempotent), `401` for invalid signature, `404` if the
        provider payment id cannot be resolved.
      security: []
      parameters:
        - in: header
          name: Tl-Signature
          required: true
          schema: { type: string }
          description: TrueLayer JWS detached signature of the raw body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider-defined; passed through to verification then state machine.
      responses:
        '200':
          description: Update accepted
        '401':
          description: Signature verification failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: providerPaymentId not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Google ID token (verified server-side on every request)

  parameters:
    BillId:
      in: path
      name: billId
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      in: path
      name: sessionId
      required: true
      schema: { type: string, format: uuid }
    PaymentId:
      in: path
      name: paymentId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, format: uuid }
      description: Client-generated UUIDv7. Cached server-side for 24 hours.

  responses:
    BadRequest:
      description: Validation failure (`INVALID_INPUT`); `details` carries field errors
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, invalid, or expired token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource does not exist or caller cannot see it
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    IdempotencyConflict:
      description: Same key with a different request body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              description: Stable error code (SCREAMING_SNAKE_CASE)
              enum:
                - AUTH_MISSING
                - AUTH_INVALID
                - AUTH_EXPIRED
                - INVALID_INPUT
                - IDEMPOTENCY_CONFLICT
                - NOT_FOUND
                - BILL_NOT_FOUND
                - SESSION_NOT_FOUND
                - PAYMENT_NOT_FOUND
                - SESSION_INVALID_STATE
                - CLAIMS_INCOMPLETE
                - PARSE_FAILED
                - PARSE_LOW_CONFIDENCE
                - RATE_LIMITED
                - PAYMENT_PROVIDER_ERROR
                - INTERNAL_ERROR
            message: { type: string, description: Human-safe explanation }
            requestId: { type: string, description: Server request ID; cross-reference in support }
            details:
              description: Optional structured detail; omitted in production for non-validation errors
              type: object
              additionalProperties: true

    User:
      type: object
      required: [userId, displayName]
      properties:
        userId: { type: string, description: Google sub claim }
        displayName: { type: string }
        email: { type: string, format: email }
        avatarUrl: { type: string, format: uri }

    Venue:
      type: object
      properties:
        placeId: { type: string }
        name: { type: string }
        address: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }

    BillItem:
      type: object
      required: [itemId, name, unitPricePence, quantity, category]
      properties:
        itemId:
          {
            type: string,
            format: uuid,
            description: Stable across amendments where item identity is preserved,
          }
        name: { type: string }
        unitPricePence: { type: integer, format: int64, minimum: 0 }
        quantity: { type: integer, minimum: 1 }
        category: { type: string, enum: [food, drink, other] }

    Bill:
      type: object
      required:
        [
          billId,
          versionNumber,
          creatorUserId,
          currency,
          subtotalPence,
          taxPence,
          serviceChargePence,
          totalPence,
          items,
          parsedFrom,
          createdAt,
        ]
      properties:
        billId: { type: string, format: uuid }
        versionNumber: { type: integer, minimum: 1 }
        creatorUserId: { type: string }
        currency: { type: string, enum: [GBP] }
        subtotalPence: { type: integer, format: int64, minimum: 0 }
        taxPence: { type: integer, format: int64, minimum: 0 }
        serviceChargePence: { type: integer, format: int64, minimum: 0 }
        totalPence: { type: integer, format: int64, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/BillItem' }
        parsedFrom:
          type: object
          required: [imageHash, parser, parserVersion, parsedAt]
          properties:
            imageHash: { type: string, description: SHA-256 hex of resized image bytes }
            parser: { type: string, example: gemini-2.5-flash }
            parserVersion: { type: string, example: v1 }
            parsedAt: { type: string, format: date-time }
        venue: { $ref: '#/components/schemas/Venue' }
        previousVersionId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    SessionStatus:
      type: string
      enum: [setup, claiming, paying, settled, abandoned]

    ParticipantPayment:
      oneOf:
        - type: object
          required: [status]
          properties:
            status: { type: string, const: unpaid }
        - type: object
          required: [status]
          properties:
            status: { type: string, const: self_paid }
        - type: object
          required: [status, paymentId]
          properties:
            status: { type: string, const: pending }
            paymentId: { type: string, format: uuid }
        - type: object
          required: [status, paymentId, paidAt]
          properties:
            status: { type: string, const: succeeded }
            paymentId: { type: string, format: uuid }
            paidAt: { type: string, format: date-time }
        - type: object
          required: [status, paymentId, reason]
          properties:
            status: { type: string, const: failed }
            paymentId: { type: string, format: uuid }
            reason: { type: string }
      discriminator:
        propertyName: status

    Participant:
      type: object
      required: [userId, displayName, claimedItemIds, payment]
      properties:
        userId: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, format: uri }
        claimedItemIds:
          type: array
          items: { type: string, format: uuid }
        owedPence:
          type: integer
          format: int64
          description: Computed at lock-claims; absent before then
        payment: { $ref: '#/components/schemas/ParticipantPayment' }

    Session:
      type: object
      required:
        [sessionId, status, creatorUserId, billId, pinnedBillVersion, participants, createdAt]
      properties:
        sessionId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/SessionStatus' }
        creatorUserId: { type: string }
        collectorUserId: { type: string, description: Same as creator for v0 }
        billId: { type: string, format: uuid }
        pinnedBillVersion: { type: integer, minimum: 1 }
        joinCode:
          type: string
          pattern: '^[A-HJ-NP-Z2-9]{6}$'
          description: Hidden during `setup`; visible to creator after `/share`; visible to participants after they join.
        participants:
          type: array
          items: { $ref: '#/components/schemas/Participant' }
        createdAt: { type: string, format: date-time }
        ttlAt: { type: string, format: date-time }

    PaymentStatus:
      type: string
      enum: [pending, authorized, succeeded, failed, refunded]

    Payment:
      type: object
      required:
        [
          paymentId,
          sessionId,
          payerUserId,
          collectorUserId,
          amountPence,
          currency,
          provider,
          status,
          createdAt,
        ]
      properties:
        paymentId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        payerUserId: { type: string }
        collectorUserId: { type: string }
        amountPence: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, enum: [GBP] }
        provider: { type: string, enum: [truelayer] }
        providerPaymentId: { type: string }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        idempotencyKey: { type: string, format: uuid }
        events:
          type: array
          description: Audit trail of state transitions
          items:
            type: object
            required: [at, from, to, source]
            properties:
              at: { type: string, format: date-time }
              from: { $ref: '#/components/schemas/PaymentStatus' }
              to: { $ref: '#/components/schemas/PaymentStatus' }
              source: { type: string, enum: [api, webhook, system] }
              note: { type: string }
        createdAt: { type: string, format: date-time }

    UploadRequest:
      type: object
      required: [sha256, sizeBytes, mimeType]
      properties:
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 hex of the resized image bytes (lowercase)
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 5242880
          description: Max 5 MB
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]

    UploadSlot:
      type: object
      required: [status, uploadId, url, expiresAt, maxBytes]
      properties:
        status: { type: string, const: new }
        uploadId: { type: string, format: uuid }
        url:
          { type: string, format: uri, description: Pre-signed S3 PUT URL (expires in 5 minutes) }
        expiresAt: { type: string, format: date-time }
        maxBytes: { type: integer, description: Enforced via Content-Length on the PUT }

    UploadDuplicate:
      type: object
      required: [status, billId]
      properties:
        status: { type: string, const: duplicate }
        billId:
          type: string
          format: uuid
          description: An existing bill matched the supplied image hash; do not upload again

    ParseRequest:
      type: object
      required: [uploadId]
      properties:
        uploadId: { type: string, format: uuid }

    AmendBillRequest:
      type: object
      required: [items, taxPence, serviceChargePence]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, unitPricePence, quantity, category]
            properties:
              itemId:
                type: string
                format: uuid
                description: Provide existing itemId to preserve identity; omit for a new item
              name: { type: string, minLength: 1 }
              unitPricePence: { type: integer, format: int64, minimum: 0 }
              quantity: { type: integer, minimum: 1 }
              category: { type: string, enum: [food, drink, other] }
        taxPence: { type: integer, format: int64, minimum: 0 }
        serviceChargePence: { type: integer, format: int64, minimum: 0 }

    CreateSessionRequest:
      type: object
      required: [billId]
      properties:
        billId: { type: string, format: uuid }
        billVersion:
          type: integer
          minimum: 1
          description: Defaults to the latest version of the bill at session-create time

    JoinByCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[A-HJ-NP-Z2-9]{6}$'

    ClaimsRequest:
      type: object
      required: [claimedItemIds]
      properties:
        claimedItemIds:
          type: array
          items: { type: string, format: uuid }
          description: Replaces the caller's full claim list; deduplicated server-side

    InitiatePaymentResponse:
      type: object
      required: [payment, providerRedirectUrl]
      properties:
        payment: { $ref: '#/components/schemas/Payment' }
        providerRedirectUrl:
          type: string
          format: uri
          description: TrueLayer authentication URL the client should open
