services:
  ddb:
    image: amazon/dynamodb-local:latest
    container_name: gdp-ddb-local
    ports:
      - '8000:8000'
    # Persisted to a named volume so local users, bills and sessions
    # survive restarts. `docker compose down -v` wipes them.
    command: ['-jar', 'DynamoDBLocal.jar', '-sharedDb', '-dbPath', '/home/dynamodblocal/data']
    user: root
    volumes:
      - ddb-data:/home/dynamodblocal/data

  s3:
    image: minio/minio:latest
    container_name: gdp-s3-local
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      - MINIO_ROOT_USER=local
      - MINIO_ROOT_PASSWORD=local-secret
      # Allow browser-side PUTs from the dev mobile (LAN IP, cloudflared, etc.).
      # Permissive in dev only.
      - MINIO_API_CORS_ALLOW_ORIGIN=*
    command: ['server', '/data', '--address', ':9000', '--console-address', ':9001']
    volumes:
      - s3-data:/data

volumes:
  ddb-data:
  s3-data:
