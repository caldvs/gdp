# Keeps PR descriptions and issue bodies free of AI attribution (see
# CLAUDE.md), the same way the commit-msg hook keeps commit messages clean.
# Some tooling appends a "Generated by Claude Code" footer to PRs and issues
# it writes; this strips it server-side so nothing has to be fixed by hand.
# Its own edits use GITHUB_TOKEN, which doesn't trigger workflows, so it
# can't loop.
name: PR attribution

on:
  pull_request:
    types: [opened, edited, reopened]
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  strip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/strip-ai-attribution.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Strip attribution from the description
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          KIND: ${{ github.event_name == 'issues' && 'issue' || 'pr' }}
        run: |
          gh "$KIND" view "$NUMBER" --json body -q .body > body.md
          cp body.md before.md
          node scripts/strip-ai-attribution.mjs body.md
          if ! cmp -s before.md body.md; then
            gh "$KIND" edit "$NUMBER" --body-file body.md
            echo "Stripped attribution from $KIND #$NUMBER"
          fi
