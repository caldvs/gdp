# Keeps PR descriptions free of AI attribution (see CLAUDE.md), the same
# way the commit-msg hook keeps commit messages clean. Some tooling appends
# a "Generated by Claude Code" footer to PR bodies it writes; this strips
# it server-side so nothing has to be fixed by hand.
name: PR attribution

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/strip-ai-attribution.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Strip attribution from the description
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$NUMBER" --json body -q .body > body.md
          cp body.md before.md
          node scripts/strip-ai-attribution.mjs body.md
          if ! cmp -s before.md body.md; then
            gh pr edit "$NUMBER" --body-file body.md
            echo "Stripped attribution from #$NUMBER"
          fi
