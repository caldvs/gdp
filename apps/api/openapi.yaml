    Session:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SessionStatus'
        creatorUserId:
          type: string
        collectorUserId:
          type: string
          description: Same as creator for v0
        billId:
          type: string
          format: uuid
        pinnedBillVersion:
          type: integer
          minimum: 1
        joinCode:
          type: string
          pattern: ^(?:[A-HJ-NP-Z2-9]{6}|[A-Za-z0-9_-]{22})$
          description: Hidden during `setup`; visible to creator after `/share`; visible to participants after they join.
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        venue:
          type: object
          properties:
            placeId:
              type: string
            name:
              type: string
            address:
              type: string
            lat:
              type: number
              format: double
            lng:
              type: number
              format: double
          description: |
            Denormalised from the pinned bill at session-create time so the
            frontend can render a venue strapline without a second round-trip.
            Optional — predates this field on old sessions, and not every bill
            has a venue the reader could extract.
        expectedDiners:
          type: integer
          minimum: 2
          maximum: 99
          description: |
            How many people the lead said are eating, lead included. Shown as
            "3 of 4 joined"; never used in the money maths. Absent until set.
        paymentsOpenedAt:
          type: string
          format: date-time
          description: |
            When the lead opened payments before every line was claimed (#216).
            Absent if they didn't.
        allClaimed:
          type: boolean
          description: |
            View only (#216): every unit and every spot in a split is claimed.
        paymentsOpen:
          type: boolean
          description: |
            View only (#216): guests can see what they owe and pay. True once
            every line is claimed, the lead opens payments early, or the bill
            is locked or closed.
        platformFeePence:
          type: integer
          minimum: 0
          description: |
            The hold that paid for sharing this bill (#165). Guests pay it back
            to the lead in proportion to what they ordered (#166). Absent when
            a credit, an exempt lead or Stripe being off paid for it.
        payoutCheck:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: |
            The lead's fingerprint of the bank details in their join link (#151),
            set with `PUT /v1/sessions/{sessionId}/payout-check`. Absent until the
            lead's device sends one.
        shares:
          type: array
          items:
            type: object
            properties:
              itemId:
                type: string
                format: uuid
              userIds:
                type: array
                items:
                  type: string
              ways:
                type: integer
                minimum: 1
                description: |
                  How many people the item is divided between. Each sharer
                  owes unitPrice × units / ways; `ways - userIds.length` spots
                  are still open.
              units:
                type: integer
                minimum: 1
                description: |
                  How many of the line the split covers (1 when absent). The
                  rest of the line is claimed one unit at a time.
              activity:
                type: array
                items:
                  $ref: '#/components/schemas/ShareActivity'
                description: Recent changes to this split, oldest first (last 10).
            required:
              - itemId
              - userIds
              - ways
              - activity
          description: |
            Computed view of share state per ADR-0006. One entry per item
            with at least one sharer; `userIds` is the splitter set. Server
            derives this from participants' `sharedItemIds` on every read.
            Absent when no items are shared.
        createdAt:
          type: string
          format: date-time
        ttlAt:
          type: string
          format: date-time
      required:
        - sessionId
        - status
        - creatorUserId
        - billId
        - pinnedBillVersion
        - participants
        - createdAt
    SessionPreview:
