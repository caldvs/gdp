      description: "The bill's live session (setup, claiming or paying: it holds the bill), else the lead's newest session for it when that one is settled. Absent when there's none or it was abandoned."
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - AUTH_MISSING
                - AUTH_INVALID
                - AUTH_EXPIRED
                - INVALID_INPUT
                - IDEMPOTENCY_CONFLICT
                - NOT_FOUND
                - BILL_NOT_FOUND
                - SESSION_NOT_FOUND
                - PAYMENT_NOT_FOUND
                - SESSION_INVALID_STATE
                - CLAIMS_INCOMPLETE
                - PAYMENTS_NOT_OPEN
                - CLAIMS_EXCEED_QUANTITY
                - PARTICIPANTS_NOT_READY
                - CLAIM_SHARE_CONFLICT
                - ITEM_NOT_SHAREABLE
                - ALREADY_PAID_FOR
                - SHARE_WAYS_TOO_LOW
                - SHARE_PAID
                - SHARE_CONFLICT
                - PARSE_FAILED
                - PARSE_LOW_CONFIDENCE
                - PARSE_TIMEOUT
                - RATE_LIMITED
                - PAYMENT_PROVIDER_ERROR
                - CHANNEL_UNAVAILABLE
                - TABLE_FEE_PAID
                - TABLE_FEE_WAIVED
                - TABLE_FEE_REQUIRED
                - INTERNAL_ERROR
              description: Stable error code (SCREAMING_SNAKE_CASE)
            message:
              type: string
              description: Human-safe explanation
            requestId:
              type: string
              description: Server request ID; cross-reference in support
            details:
              type: object
              additionalProperties: {}
              description: Optional structured detail; omitted in production for non-validation errors
          required:
            - code
            - message
            - requestId
      required:
        - error
    FeeCharge:
      type: object
      properties:
        billId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - charged
            - needs_confirming
            - none
        amountPence:
          type: integer
        clientSecret:
          type: string
          description: The PaymentIntent to confirm in the page
        paymentMethodId:
          type: string
          description: The saved card, offered first
        card:
          $ref: '#/components/schemas/CardSummary'
      required:
        - billId
        - status
        - amountPence
    ForkBillRequest:
      type: object
      properties:
        from:
          type: string
          enum:
            - latest
            - analysis
          default: latest
          description: "`latest`: copy the latest version (the lead's corrections carry over). `analysis`: what the current parser reads off the photo."
    GuestJoinCodeRefused:
      type: object
      properties:
        status:
          type: string
          enum:
            - wrong
            - expired
        attemptsLeft:
          type: integer
          minimum: 0
      required:
        - status
    GuestJoinRequest:
      type: object
      properties:
        code:
          type: string
          pattern: ^(?:[A-HJ-NP-Z2-9]{6}|[A-Za-z0-9_-]{22})$
        name:
          type: string
          minLength: 1
          maxLength: 40
        requestId:
          type: string
          maxLength: 100
          description: From guest-join/start (#214)
        phoneCode:
          type: string
          pattern: ^[0-9]{4}$
          description: The texted code (#214)
      required:
        - code
        - name
    GuestJoinResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - joined
        token:
          type: string
