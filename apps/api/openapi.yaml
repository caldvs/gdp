        - leadName
        - dateISO
        - settled
        - billTotalPence
        - expiresAt
        - diners
        - unclaimed
        - unclaimedPence
      description: "#220 G5: a bill seen from a guest's text. No numbers, no bank details."
    BillRead:
      type: object
      properties:
        readId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - reading
            - done
            - failed
        billId:
          type: string
          format: uuid
          description: Set when `done`
        duplicate:
