version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Repo root = npm workspaces root, so this covers apps/api, apps/web and packages/*.
    groups:
      web:
        patterns: ['next', 'react', 'react-dom', '@types/react*', '@tanstack/*']
      aws-sdk:
        patterns: ['@aws-sdk/*', 'aws-cdk', 'aws-cdk-lib', 'constructs']
      dev-tooling:
        patterns:
          - eslint*
          - '@eslint/*'
          - typescript-eslint
          - prettier
          - vitest
          - tsx
          - esbuild
          - typescript

  # Also keeps the SHA-pinned actions in .github/workflows current (#152).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
