name: Web Deploy

# Vercel Hobby allows 100 deployments a day, and skipped or cancelled builds
# count. So pushes don't deploy (apps/web/vercel.json switches Git deploys off
# for every branch but `preview`, which serves test.paymeback.dev). Instead:
#
# - Production: every hour, deploy main if the web app changed since the
#   last production deploy. The `web-prod` tag marks what's live. Run it by
#   hand (Actions → Web Deploy → Run workflow) to ship straight away.
#   It waits for the prod API (#80): production talks to GdpBackendProd,
#   which deploys by hand (API Deploy → prod) and marks itself with the
#   `api-prod` tag. If the API's code or contract has changed since then,
#   the web build that needs it isn't put live until the API is.
# - Previews: add the `preview` label to a PR. Each push to a labelled PR
#   deploys a preview and comments the URL; remove the label to stop.
#
# Needs the VERCEL_TOKEN repo secret (vercel.com/account/tokens).

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Deploy main even if the web app hasn't changed
        type: boolean
        default: false
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: web-deploy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'prod' }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_q5vYiPRRAr17CPwZR2Dbhopi
  VERCEL_PROJECT_ID: prj_1FsdXAkZbS0ikRFRXJXJ9BPKvDK9
  # Paths the web build depends on (same list as vercel.json's ignoreCommand).
  WEB_PATHS: apps/web packages/core package.json package-lock.json
  # The API code and contract the web app talks to (#80). Infra-only and
  # test changes don't hold the web app back.
  API_PATHS: apps/api/src apps/api/openapi.yaml

jobs:
  production:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Anything new for the web app?
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          head=$(git rev-parse HEAD)
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = "true" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! last=$(git rev-parse -q --verify 'refs/tags/web-prod^{commit}'); then
            echo "No web-prod tag yet: deploying"; echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$last" "$head" -- $WEB_PATHS; then
            echo "Web app unchanged since ${last::7}: nothing to deploy"; echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Web app changed since ${last::7}: deploying ${head::7}"; echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Is the prod API ready for it?
        id: api
        if: steps.check.outputs.deploy == 'true'
        run: |
          head=${{ steps.check.outputs.sha }}
          if ! api=$(git rev-parse -q --verify 'refs/tags/api-prod^{commit}'); then
            msg="No api-prod tag: deploy the API to prod first (API Deploy → prod)."
          elif git diff --quiet "$api" "$head" -- $API_PATHS; then
            echo "Prod API (${api::7}) has the API code ${head::7} needs"; echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0
          else
            changed=$(git diff --name-only "$api" "$head" -- $API_PATHS | wc -l | tr -d ' ')
            msg="Waiting for the prod API: ${changed} API file(s) changed since prod's ${api::7}. Run API Deploy → prod, then this deploys on the next hour (or run it by hand)."
          fi
          echo "::warning::$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"; echo "ok=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        if: steps.check.outputs.deploy == 'true' && steps.api.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
      - name: Deploy to production
        if: steps.check.outputs.deploy == 'true' && steps.api.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "Deployed $url" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Move the web-prod tag
        if: steps.check.outputs.deploy == 'true' && steps.api.outputs.ok == 'true'
        run: |
          git tag -f web-prod "${{ steps.check.outputs.sha }}"
          git push -f origin refs/tags/web-prod

  preview:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action == 'synchronize' || github.event.label.name == 'preview')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Deploy a preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@latest deploy --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Comment the URL
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "Preview for ${SHA::7}: $URL" --edit-last --create-if-none
