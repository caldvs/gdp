name: Deploy to prod

# One manual run puts a commit live (#124): the prod API first, then
# paymeback.dev from the same commit. `main` itself only ever deploys to test
# (CI's deploy-test-web job and Deploy API → dev).
#
# - Refuses a commit that isn't on main or whose CI `gate` didn't pass.
# - The prod API deploy (Deploy API, environment `prod`, with its reviewer)
#   runs the smoke test and dependency check; if either fails, the web app
#   isn't touched.
# - The web app is a fresh Vercel production build (it bakes in the prod API
#   URL and NEXT_PUBLIC_APP_ENV=prod), then the commit is recorded as a `live`
#   deployment (Settings → Environments → live) named release-YYYY-MM-DD-n.
#
# Rollback: the web app with Vercel's Instant Rollback (no build); the API by
# running Deploy to prod again on the previous `live` deployment's commit.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to release (blank = latest main)
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: check the commit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve and check
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha=$(git rev-parse --verify "${INPUT_SHA:-origin/main}^{commit}")
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::${sha::7} isn't on main"; exit 1; }
          gate=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=gate&filter=latest" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          if [ "$gate" = "0" ]; then
            echo "::error::CI's gate didn't pass on ${sha::7}; release a commit that's green"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing ${sha::7}" >> "$GITHUB_STEP_SUMMARY"

  api:
    name: prod API
    needs: check
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-api.yml
    with:
      environment: prod
      ref: ${{ needs.check.outputs.sha }}
    secrets: inherit

  web:
    name: paymeback.dev
    needs: [check, api]
    runs-on: ubuntu-24.04
    env:
      VERCEL_ORG_ID: team_q5vYiPRRAr17CPwZR2Dbhopi
      VERCEL_PROJECT_ID: prj_1FsdXAkZbS0ikRFRXJXJ9BPKvDK9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          url=$(npx --yes vercel@64.7.0 deploy --prod --yes --token "$VERCEL_TOKEN" --meta githubCommitSha="$SHA")
          echo "paymeback.dev → $url (${SHA::7})" | tee -a "$GITHUB_STEP_SUMMARY"

  record:
    name: record the release
    needs: [check, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A GitHub deployment, not a tag: GitHub refuses a tag from this token
      # on a commit that changed a workflow file.
      - name: Record and summarise
        env:
          SHA: ${{ needs.check.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          r="repos/$GITHUB_REPOSITORY/deployments"
          prev=$(gh api "$r?environment=live&per_page=1" --jq '.[0].sha // empty')
          day=$(date -u +%Y-%m-%d)
          n=$(( $(gh api "$r?environment=live&per_page=100" --jq "[.[] | select((.description // \"\") | startswith(\"release-$day-\"))] | length") + 1 ))
          name="release-$day-$n"
          id=$(jq -n --arg sha "$SHA" --arg d "$name" '{ref: $sha, environment: "live", auto_merge: false, required_contexts: [], description: $d}' \
            | gh api "$r" --input - --jq .id)
          gh api "$r/$id/statuses" -f state=success -f environment_url=https://paymeback.dev >/dev/null
          {
            echo "## $name (${SHA::7})"
            if [ -n "$prev" ]; then
              echo "Since ${prev::7}:"
              git log --format='- %h %s' "$prev..$SHA"
            else
              echo "First release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
