          format: uuid
        leadName:
          type: string
        venueName:
          type: string
        dateISO:
          type: string
          format: date-time
        settled:
          type: boolean
        billTotalPence:
          type: integer
        expiresAt:
          type: string
          format: date-time
          description: When the link stops working
