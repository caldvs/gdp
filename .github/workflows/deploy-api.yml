name: Deploy API

# Deploy to test (deploy-test.yml) calls this hourly with `environment: dev` when
# the newest green commit on main changed the API. Manual dispatch → redeploy
# dev now.
# Prod only deploys through Deploy to prod (deploy-prod.yml), which calls
# this one with `environment: prod` (#124).
#
# Required setup (one-off, per AWS account/environment):
#   1. Create a GitHub OIDC IAM role in each AWS account (infra/githubDeploy.ts).
#      It trusts only jobs in its GitHub environment, so the `environment:`
#      below is what lets a job assume it.
#   2. In GitHub → Settings → Environments, create `dev` and `prod`. For
#      each, set these *variables* (not secrets — ARNs are not sensitive):
#        - AWS_DEPLOY_ROLE_ARN   arn:aws:iam::<acct>:role/<role-name>
#        - AWS_REGION            eu-west-2
#      Limit both to the `main` branch, and add a required reviewer to `prod`.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (prod deploys through Deploy to prod)
        required: true
        type: choice
        default: dev
        options: [dev]
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      ref:
        description: Commit to deploy
        type: string
        required: true

concurrency:
  # Serialise deploys per environment, but allow dev and prod to deploy in parallel.
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  id-token: write # for OIDC
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    environment: ${{ inputs.environment || 'dev' }}
    env:
      ENV_NAME: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # This job can mint the AWS deploy role's OIDC token, so no package's
      # install script runs here (#152). esbuild (CDK bundling) is the one
      # that needs its own; rebuild just that.
      - run: npm ci --ignore-scripts && npm rebuild esbuild
        working-directory: .

      # Re-run the cheap safety nets before touching AWS. Catches the
      # case where someone bypassed branch protection or a flaky CI run
      # was overridden.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run validate:bundle

      # Prod only ever deploys main, through Deploy to prod. The `prod` GitHub
      # environment should also be limited to main; this holds even if it isn't.
      - name: Refuse prod outside main
        if: env.ENV_NAME == 'prod' && (github.ref != 'refs/heads/main' || github.workflow != 'Deploy to prod')
        run: |
          echo "::error::prod deploys only from main through Deploy to prod (this run: ${GITHUB_WORKFLOW} on ${GITHUB_REF})"
          exit 1

      - name: Resolve stack name
        id: stack
        run: |
          case "$ENV_NAME" in
            dev)  echo "name=GdpBackendDev"  >>"$GITHUB_OUTPUT" ;;
            prod) echo "name=GdpBackendProd" >>"$GITHUB_OUTPUT" ;;
          esac

      # Prints the OIDC subject AWS checks against the role's trust policy,
      # so a "Not authorized to perform AssumeRoleWithWebIdentity" error can
      # be matched to what GitHub actually sent. None of these are secret.
      - name: Show OIDC claims
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(echo "$token" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          echo "$payload" | base64 -d | jq '{sub, aud, environment, repository}'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gh-actions-${{ env.ENV_NAME }}-${{ github.run_id }}

      - name: CDK deploy
        # Only this step: the API's own config check (run by the tests
        # above) rejects an empty APP_BASE_URL. Both come from the GitHub
        # environment's variables; see infra/main.ts.
        env:
          STRIPE_ENABLED: ${{ vars.STRIPE_ENABLED }}
          WHATSAPP_ENABLED: ${{ vars.WHATSAPP_ENABLED }}
          SMS_SENDER_ID: ${{ vars.SMS_SENDER_ID }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          # Comma list of emails that never pay the platform fee and sign in
          # with no link. A secret only, so the addresses never appear in a
          # public run log (#137).
          TABLE_FEE_EXEMPT_EMAILS: ${{ secrets.TABLE_FEE_EXEMPT_EMAILS }}
          # Optional custom API domain: both or neither (infra/main.ts).
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          API_CERT_ARN: ${{ vars.API_CERT_ARN }}
        run: |
          npx cdk deploy "${{ steps.stack.outputs.name }}" \
            --require-approval never \
            --outputs-file "cdk-outputs.${ENV_NAME}.json"

      - name: Extract API URL
        id: api
        run: |
          # The custom domain (api.paymeback.dev / api.test.paymeback.dev)
          # when the stack has one, so the smoke test goes through its DNS
          # and certificate; else the execute-api URL.
          url=$(jq -r --arg s "${{ steps.stack.outputs.name }}" \
            '.[$s].ApiDomainUrlOutput // .[$s].ApiUrlOutput' "cdk-outputs.${ENV_NAME}.json")
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "::error::ApiUrlOutput missing from cdk-outputs.${ENV_NAME}.json"
            cat "cdk-outputs.${ENV_NAME}.json"
            exit 1
          fi
          echo "url=$url" >>"$GITHUB_OUTPUT"

      - name: Smoke test
        run: npx tsx scripts/smoke.ts "${{ steps.api.outputs.url }}"

      # Runs inside the deployed Lambda: Stripe keys and prices, Bedrock
      # model access, SES sender. Fails the deploy if a required one is
      # broken; optional ones show as warnings.
      - name: Dependency check
        run: |
          fn=$(jq -r --arg s "${{ steps.stack.outputs.name }}" \
            '.[$s].ApiFunctionNameOutput' "cdk-outputs.${ENV_NAME}.json")
          npx tsx scripts/deps-check.ts "$fn"

      # The deploy roles' own stacks (infra/githubDeploy.ts), dev and prod,
      # from the prod job only (#144): it needs the prod environment's
      # reviewer, so a push to main can't rewrite either role's trust
      # policy. Both live in this account. Last, so a mistake
      # in a trust policy can't stop an API deploy; the next run would fail to
      # assume the role, and the fix is `npx cdk deploy GdpGithubDeploy
      # --profile gdp-dev` with the provider ARN below. The OIDC provider
      # predates the stacks, so pass its ARN rather than letting CDK try to
      # create a second one.
      - name: Deploy role stacks
        if: env.ENV_NAME == 'prod'
        run: |
          acct=$(aws sts get-caller-identity --query Account --output text)
          npx cdk deploy GdpGithubDeploy GdpGithubDeployProd \
            --require-approval never \
            --outputs-file cdk-outputs.roles.json \
            -c "githubOidcProviderArn=arn:aws:iam::${acct}:oidc-provider/token.actions.githubusercontent.com"
          echo "Prod deploy role: $(jq -r '.GdpGithubDeployProd.DeployRoleArnOutput' cdk-outputs.roles.json)" >>"$GITHUB_STEP_SUMMARY"

      # The daily cost email (infra/costReport.ts): one for the whole
      # account, so from the dev job only, like the role stacks.
      - name: Deploy cost report
        if: env.ENV_NAME == 'dev'
        run: npx cdk deploy GdpCostReport --require-approval never

      - name: Upload CDK outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cdk-outputs-${{ env.ENV_NAME }}
          path: apps/api/cdk-outputs.${{ env.ENV_NAME }}.json
          if-no-files-found: ignore
          retention-days: 14
