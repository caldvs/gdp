name: Web CI

on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'packages/**', 'package-lock.json', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['apps/web/**', 'packages/**', 'package-lock.json', '.github/workflows/web-ci.yml']

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    name: core tests • typecheck • build • smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w packages/core
      - run: npm test -w packages/core
      - run: npm run typecheck -w apps/web
      - run: npm run build -w apps/web
      - run: npx playwright install --with-deps chromium webkit
        working-directory: apps/web
      - run: npm run e2e -w apps/web
      # On failure, keep the report and any screenshots it wrote (including
      # new visual baselines) so they can be inspected or committed.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            apps/web/test-results/
            apps/web/e2e/*-snapshots/
          retention-days: 7
