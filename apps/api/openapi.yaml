# Generated from apps/api/src/openapi by `npm run gen:openapi -w apps/api`. Edit the Zod there, not this file.
openapi: 3.1.0
info:
  title: Pay Me Back API
  version: 0.1.0
  summary: Group restaurant bill splitting and Open Banking settlement.
  description: |
    Backend for the Pay Me Back web app.

    ## Conventions

    - **All money is integer pence (GBP).** No floats anywhere on the wire.
    - **All identifiers are UUIDv7** unless documented otherwise.
    - **Timestamps are RFC 3339** strings.
    - **Auth** uses session JWTs issued by `POST /v1/auth/email/verify` (the emailed 6-digit code). Tokens are passed as `Authorization: Bearer <jwt>` and verified (signature + expiry) on every `/v1/*` request. The verified `sub` claim is the only userId the server trusts — any `userId` in a request body is ignored.
    - **Errors** use a single envelope (`ErrorResponse`). `error.code` is the stable identifier; `error.message` is human-safe.
    - **Idempotency** is required on every state-changing payment endpoint via the `Idempotency-Key` header. Same key + same body returns the cached response; same key + different body, or the same key while the first request is still running, returns `409 IDEMPOTENCY_CONFLICT`.
    - **Versioning** is path-based (`/v1/...`). Multiple versions may run in parallel.
  contact:
    name: Pay Me Back
  license:
    name: Proprietary
servers:
  - url: https://api.gdp.example.com
    description: production (placeholder until deploy)
  - url: http://localhost:3000
    description: local development
security:
  - bearerAuth: []
tags:
  - name: identity
    description: The authenticated caller
  - name: bills
    description: Photographing, parsing, retrieving, and amending bills
  - name: sessions
    description: Group dining sessions, the join flow, and claim management
  - name: payments
    description: Guests paying the lead by bank transfer, confirmed by the lead
  - name: links
    description: "The links in guests' texts (#219, #220); no sign-in"
  - name: billing
    description: The lead's table fee, paid to Pay Me Back through Stripe
  - name: webhooks
    description: Server-to-server callbacks (Stripe)
  - name: ops
    description: Health and readiness probes
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session JWT minted by `/v1/auth/email/verify` (the emailed code). Verified server-side on every request.
  responses:
    BadRequest:
      description: Validation failure (`INVALID_INPUT`); `details` carries field errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource does not exist or caller cannot see it
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyConflict:
      description: Same key with a different request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AmendBillRequest:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              itemId:
                type: string
                format: uuid
                description: Provide existing itemId to preserve identity; omit for a new item
              name:
                type: string
                minLength: 1
                maxLength: 200
              unitPricePence:
                type: integer
                minimum: 0
                maximum: 10000000
              quantity:
                type: integer
                exclusiveMinimum: 0
                maximum: 999
              category:
                type: string
                enum:
                  - food
                  - drink
                  - other
              course:
                type: string
                enum:
                  - starter
                  - main
                  - side
                  - dessert
            required:
              - name
              - unitPricePence
              - quantity
              - category
          minItems: 1
          maxItems: 200
        taxPence:
          type: integer
          minimum: 0
          maximum: 10000000
        serviceChargePence:
          type: integer
          minimum: 0
          maximum: 10000000
        discounts:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 200
              amountPence:
                type: integer
                exclusiveMinimum: 0
                maximum: 10000000
            required:
              - name
              - amountPence
          maxItems: 20
          description: The bill's shared discounts. Absent keeps them; [] removes them. More off than the items come to is INVALID_INPUT.
        venue:
          type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 80
            placeId:
              type: string
              maxLength: 200
            address:
              type: string
              maxLength: 300
          required:
            - name
          description: Set to override the parsed venue; absent keeps whatever the bill has.
      required:
        - items
        - taxPence
        - serviceChargePence
    Bill:
      type: object
      properties:
        billId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          minimum: 1
        creatorUserId:
          type: string
        currency:
          type: string
          enum:
            - GBP
        subtotalPence:
          type: integer
          minimum: 0
          format: int64
        taxPence:
          type: integer
          minimum: 0
          format: int64
        serviceChargePence:
          type: integer
          minimum: 0
          format: int64
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/BillDiscount'
          maxItems: 20
          description: |
            Discounts that aren't one item's (8 Nov 2026), shown under the items and shared by what
            each person had, like service, but taken off. A discount on one item is folded into that
            item's price instead. Absent on older bills.
        totalPence:
          type: integer
          minimum: 0
          format: int64
          description: subtotal + tax + service − the discounts.
        parsedTotalPence:
          type: integer
          minimum: 0
          format: int64
          description: |
            The total printed on the receipt itself, as read by OCR.
            Kept alongside the computed `totalPence` so the client can
            flag a mismatch — typical causes are OCR misreading an item
            price, a restaurant arithmetic error, or an undisclosed
            discount/tip baked into the printed total. Optional because
            old bills predate this field and not every parser surfaces it.
        items:
          type: array
          items:
            $ref: '#/components/schemas/BillItem'
        parsedFrom:
          type: object
          properties:
            imageHash:
              type: string
              description: SHA-256 hex of resized image bytes
            parser:
              type: string
              example: eu.anthropic.claude-sonnet-4-6
            parserVersion:
              type: string
              example: v1
            parsedAt:
              type: string
              format: date-time
            uploadId:
              type: string
              format: uuid
              description: Original upload identifier; absent on bills parsed before this field was retained.
            source:
              type: string
              enum:
                - parser
                - cache
              description: |
                Where this bill's read came from: the parser, or the analysis
                cache (the same image read before by the same parser
                fingerprint, by anyone). Absent on bills from before the cache.
            analysedAt:
              type: string
              format: date-time
              description: When the read this bill came from was made. Absent on bills from before the cache.
            forkedFrom:
              type: object
              properties:
                billId:
                  type: string
                  format: uuid
                versionNumber:
                  type: integer
                  minimum: 1
              required:
                - billId
                - versionNumber
              description: 'Set on a bill made by Start again (`POST /v1/bills/{billId}/fork`): the bill and version it came from.'
          required:
            - imageHash
            - parser
            - parserVersion
            - parsedAt
        venue:
          $ref: '#/components/schemas/Venue'
        previousVersionId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
      required:
        - billId
        - versionNumber
        - creatorUserId
        - currency
        - subtotalPence
        - taxPence
        - serviceChargePence
        - totalPence
        - items
        - parsedFrom
        - createdAt
    BillDiscount:
      type: object
      properties:
        name:
          type: string
        amountPence:
          type: integer
          minimum: 1
          format: int64
          description: The amount off.
      required:
        - name
        - amountPence
    BillingSummary:
      type: object
      properties:
        card:
          $ref: '#/components/schemas/CardSummary'
        creditsLeft:
          type: integer
          enum:
            - 0
            - 1
        nextCreditOn:
          type: string
          format: date
        paidPence:
          type: integer
          description: Every fee paid, refunded ones included
        refundedPence:
          type: integer
        fees:
          type: array
          items:
            type: object
            properties:
              billId:
                type: string
                format: uuid
              sessionId:
                type: string
                format: uuid
                description: The session this fee shared
              amountPence:
                type: integer
              paidAt:
                type: string
                format: date-time
              kind:
                type: string
                enum:
                  - hold
                description: A £1 hold, counted in `paidPence` only for what was taken at close (`capturedPence`) or charged at settle (`chargePence`).
              releasedAt:
                type: string
                format: date-time
              capturedPence:
                type: integer
                description: What was taken from the hold at close, the guests' part (#167).
              capturedAt:
                type: string
                format: date-time
              savedCard:
                type: boolean
                enum:
                  - true
                description: '#228: the hold saved the card, so settle charges it the round-ups, no cap.'
              chargeStatus:
                type: string
                enum:
                  - charged
                  - needs_confirming
                  - none
                description: |
                  #228: the charge at settle on the saved card: the round-ups of the guests the
                  lead marked received, no cap. `needs_confirming`: the bank wants the lead to
                  confirm it. `none`: under 30p, or nobody paid.
              chargePence:
                type: integer
              chargedAt:
                type: string
                format: date-time
              refundedAt:
                type: string
                format: date-time
            required:
              - billId
              - amountPence
              - paidAt
        credits:
          type: array
          items:
            type: object
            properties:
              month:
                type: string
                description: '`yyyy-mm`, UK time'
              billId:
                type: string
                format: uuid
              sessionId:
                type: string
                format: uuid
              claimedAt:
                type: string
                format: date-time
              returnedAt:
                type: string
                format: date-time
                description: Given back because nobody joined
            required:
              - month
              - billId
              - sessionId
              - claimedAt
      required:
        - creditsLeft
        - nextCreditOn
        - paidPence
        - refundedPence
        - fees
        - credits
    BillItem:
      type: object
      properties:
        itemId:
          type: string
          format: uuid
          description: Stable across amendments where item identity is preserved
        name:
          type: string
        unitPricePence:
          type: integer
          minimum: 0
          format: int64
        quantity:
          type: integer
          minimum: 1
        category:
          type: string
          enum:
            - food
            - drink
            - other
        course:
