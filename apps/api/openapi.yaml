              lines:
                type: array
                items:
                  $ref: '#/components/schemas/ReportLine'
              itemsPence:
                type: integer
              extrasPence:
                type: integer
                description: Their part of service and tax
              discountPence:
                type: integer
                description: Their part of the bill's discount
              feePence:
                type: integer
                description: Their round-up
              totalPence:
                type: integer
              paid:
                type: object
                properties:
                  kind:
                    type: string
                    enum:
                      - lead
                      - paid
                      - says_paid
                      - not_paid
                  amountPence:
                    type: integer
                required:
                  - kind
            required:
              - displayName
              - isLead
              - isYou
              - lines
              - itemsPence
              - extrasPence
              - discountPence
              - feePence
              - totalPence
              - paid
        unclaimed:
