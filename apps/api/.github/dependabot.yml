version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns: ['@aws-sdk/*', 'aws-cdk', 'aws-cdk-lib', 'constructs']
      dev-tooling:
        patterns:
          - eslint*
          - '@eslint/*'
          - typescript-eslint
          - prettier
          - vitest
          - tsx
          - esbuild
          - typescript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
