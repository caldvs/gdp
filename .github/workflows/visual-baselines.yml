# Regenerates the visual snapshot baselines on the same runner CI uses and
# uploads them. Download the artifact and commit apps/web/e2e/visual.spec.ts-snapshots/.
name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test visual --project=desktop --update-snapshots
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: apps/web/e2e/visual.spec.ts-snapshots/
