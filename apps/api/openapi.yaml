        - currency
        - subtotalPence
        - taxPence
        - serviceChargePence
        - totalPence
        - items
        - parsedFrom
        - createdAt
    ParseRequest:
      type: object
      properties:
        uploadId:
          type: string
          format: uuid
        skipCache:
          type: boolean
          description: "Local API only (ignored elsewhere): read the photo with the model again even if it was read before. The new bill replaces the old one as this photo's bill."
      required:
        - uploadId
    Participant:
      type: object
      properties:
        userId:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
        claimedItemIds:
          type: array
          items:
            type: string
            format: uuid
        sharedItemIds:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Items this participant is sharing with other diners (ADR-0006).
            Distinct from `claimedItemIds`: a share is one unit of a
            quantity-1 item divided equally across all sharers, with
            deterministic largest-remainder rounding.
        owedPence:
          type: integer
          format: int64
          description: Computed at lock-claims; absent before then
        payment:
          $ref: '#/components/schemas/ParticipantPayment'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantPaymentEntry'
          description: |
            `payment` above is the latest state across these: in flight if
            any payment is, else paid if any was. "Paid" doesn't mean nothing
            more is owed; compare the sent payments with what's owed now.
            Every payment this guest has made to the lead, oldest first (#121:
            a guest who claims more after paying tops up the difference). A
            `pending` payment without `payerClaimedPaidAt` was opened but not
            sent yet. Absent on sessions from before top-ups.
        readyToLock:
          type: boolean
          description: |
            True once the diner has signalled they're done claiming via
            `POST /v1/sessions/:id/ready`. Lead's `lock-claims` rejects
            with `PARTICIPANTS_NOT_READY` unless all non-creator participants
            are ready (override with `force: true`). Creator is implicitly
            ready and cannot toggle this flag.
      required:
        - userId
        - displayName
        - claimedItemIds
        - sharedItemIds
        - payment
        - readyToLock
    ParticipantPayment:
      oneOf:
        - type: object
          properties:
            status:
              type: string
              enum:
                - unpaid
          required:
            - status
        - type: object
          properties:
            status:
              type: string
              enum:
                - self_paid
          required:
            - status
        - type: object
          properties:
            status:
              type: string
              enum:
                - pending
            paymentId:
              type: string
              format: uuid
            payerClaimedPaidAt:
              type: string
              format: date-time
              description: |
                Mirrors `Payment.payerClaimedPaidAt` — set when the payer hits
                `/v1/payments/{paymentId}/mark-paid` to claim they've sent the money.
                The lead's UI can use this to flag "they say they paid" alongside the
                pending payment.
          required:
            - status
            - paymentId
        - type: object
          properties:
            status:
              type: string
              enum:
                - succeeded
            paymentId:
              type: string
              format: uuid
            paidAt:
              type: string
              format: date-time
          required:
            - status
            - paymentId
            - paidAt
        - type: object
          properties:
            status:
              type: string
              enum:
                - failed
            paymentId:
              type: string
              format: uuid
            reason:
              type: string
          required:
            - status
            - paymentId
            - reason
    ParticipantPaymentEntry:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        amountPence:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
        payerClaimedPaidAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
        reason:
          type: string
      required:
        - paymentId
        - amountPence
        - status
    Payment:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        payerUserId:
          type: string
        collectorUserId:
          type: string
        amountPence:
          type: integer
          minimum: 0
          format: int64
        currency:
          type: string
          enum:
            - GBP
        status:
          $ref: '#/components/schemas/PaymentStatus'
        idempotencyKey:
          type: string
          format: uuid
        events:
          type: array
          items:
            type: object
            properties:
              at:
                type: string
                format: date-time
              from:
                $ref: '#/components/schemas/PaymentStatus'
              to:
                $ref: '#/components/schemas/PaymentStatus'
              source:
                type: string
                enum:
                  - api
                  - system
              note:
                type: string
            required:
              - at
              - from
              - to
              - source
          description: Audit trail of state transitions
        createdAt:
          type: string
          format: date-time
        payerClaimedPaidAt:
          type: string
          format: date-time
          description: |
            Set when the payer hits `POST /v1/payments/{paymentId}/mark-paid` to claim
            "I've sent the money via my bank app". Surfaced in the lead's session view so
            they know which pending payments are awaiting their `/confirm`. Does not advance
            payment status — only `/confirm` does that.
      required:
        - paymentId
        - sessionId
        - payerUserId
        - collectorUserId
        - amountPence
        - currency
        - status
        - createdAt
    PaymentInstructions:
      type: object
      properties:
        type:
          type: string
          enum:
            - manual_transfer
        bankDetails:
          type: object
          properties:
            sortCode:
              type: string
              pattern: ^[0-9]{6}$
            accountNumber:
              type: string
              pattern: ^[0-9]{8}$
            accountHolderName:
              type: string
          required:
            - sortCode
            - accountNumber
            - accountHolderName
          description: The collector's bank details, when stored server-side. Omitted when they only live on the lead's device (ADR-0002); clients then use the details from the join QR fragment.
        reference:
          type: string
          description: "What the guest puts on their bank transfer: the venue and their first name ('Gennaro Tom'), letters, digits and spaces, at most 18 characters"
        amountPence:
          type: integer
          minimum: 1
        links:
          type: object
          properties:
            monzo:
              type: string
              format: uri
              example: https://monzo.me/callum.davies/12.34?d=gdp-019e137a
            revolut:
              type: string
              format: uri
              example: https://revolut.me/callumd/12.34
          description: One-tap deep links into popular banking apps; populated only if the lead has the matching handle saved on `payoutAccount`.
      required:
        - type
        - reference
        - amountPence
        - links
      description: |
        How the guest pays: the bank details and reference to use in their own banking app,
        plus optional Monzo/Revolut links. The lead then confirms receipt via
        `POST /v1/payments/{paymentId}/confirm`.
    PaymentStatus:
      type: string
      enum:
        - pending
        - succeeded
        - failed
    PayoutAccount:
      type: object
      properties:
        sortCode:
          type: string
          pattern: ^\d{6}$
          description: UK sort code, 6 digits, no separators
          example: '040668'
        accountNumber:
          type: string
          pattern: ^\d{8}$
          description: UK account number, 8 digits
          example: '00079660'
        accountHolderName:
          type: string
          minLength: 1
          maxLength: 150
          example: Callum Davies
        monzoHandle:
          type: string
          pattern: ^[a-zA-Z0-9._-]{1,30}$
          description: Optional monzo.me username (without the leading `@` or domain). When set, guest payment instructions include a one-tap `https://monzo.me/<handle>/...` link.
          example: callum.davies
        revolutTag:
          type: string
          pattern: ^[a-zA-Z0-9]{1,32}$
          description: Optional Revolut tag (without the leading `@`). When set, guest payment instructions include a one-tap `https://revolut.me/<tag>/...` link.
          example: callumd
      required:
        - sortCode
        - accountNumber
        - accountHolderName
      description: A UK bank account. Per ADR-0002 it lives on the lead's device and travels in the join link's fragment; the server never stores it.
    PostCommentRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 280
          description: Plain text, trimmed
      required:
        - text
    Proof:
